# VPS（Ubuntu + Docker）用。GitHub Actions がサーバーの /opt/catsdaiko に配置して起動する。
services:
  app:
    build: ./src
    restart: unless-stopped
    environment:
      PORT: "8080"
      TZ: Asia/Tokyo
      SITE_URL: https://${SITE_HOST}
      SECRET_KEY: ${SECRET_KEY}
      PAYPAY_ENCRYPTION_KEY: ${PAYPAY_ENCRYPTION_KEY}
      PAYPAY_DATA_DIR: /data/paypay
      PAYPAY_LEDGER_PATH: /data/paypay/payments.sqlite3
      TSUM_DATA_DIR: /data/tsum       # ツムツム代行の作業用（引き継ぎ情報の控え・バージョンのキャッシュ）
      PUNI_DATA_DIR: /data/puni       # ぷにぷに代行の作業用（udkey・ログ・マスタのキャッシュ）
      # Q&Aチャットの AI回答を使うなら、/opt/catsdaiko/.env に ANTHROPIC_API_KEY=sk-ant-... を書く。
      # 未設定（空）なら AI は呼ばれず、固定のFAQ案内にフォールバックする。
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # 実績（感想）を保存する前の AI の確認。.env に REVIEW_AI=0 と書くと止まる（決まった検査だけになる）。
      REVIEW_AI: ${REVIEW_AI:-}
      # 購入時の人間確認（Cloudflare Turnstile）。2つともあるときだけ有効。空なら確認なしで動く。
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      # お店の名前・問い合わせ先など（docs/SETUP.md）。.env に書いたものだけ効く。空なら site_config.py の既定値。
      SHOP_NAME: ${SHOP_NAME:-}
      SHOP_X_ID: ${SHOP_X_ID:-}
      REVIEW_POST_ID: ${REVIEW_POST_ID:-}
      REVIEWS_ENABLED: ${REVIEWS_ENABLED:-}
      # ぷにぷにの長時間周回（回し放題・50周以上）専用の実行枠の数。既定 3。0 で、ふつうの枠を使う。
      LONG_JOB_SLOTS: ${LONG_JOB_SLOTS:-3}
      # ツムツムの「プレミアムBOX+」（メダルで引く）の支払い方法の番号。空なら最初の実行で確かめて保存する。
      # 分かっているなら .env に TSUM_PREMIUM_PLUS_PAYTYPE=<番号> と書く（こちらが優先）。
      TSUM_PREMIUM_PLUS_PAYTYPE: ${TSUM_PREMIUM_PLUS_PAYTYPE:-}
      TSUM_PREMIUM_PLUS_GACHA_ID: ${TSUM_PREMIUM_PLUS_GACHA_ID:-0}
      GOOGLE_SITE_VERIFICATION: ${GOOGLE_SITE_VERIFICATION:-}
      # LINEログインのIPローテーション。固定IPだと画像認証/reCAPTCHA が繰り返し出てログインできないことがある。
      # ホスト(Ubuntu)に入れた Tor を host.docker.internal（＝docker のホストゲートウェイ。この環境では
      # 192.168.0.1。remote-setup.sh が 0.0.0.0:9050 で待ち受けるのでゲートウェイIPに依存しない）:9050 経由で使い、
      # やり直しごとに別の出口IP（別回線）でログインする。ゲーム本体の通信は既定どおり直接のまま。
      # Tor をやめて住宅/モバイルのローテーション型プロキシにするときは、この値を差し替える。
      TSUM_SOCKS_URL: "socks5h://host.docker.internal:9050"
      ADMIN_PASSWORD_FILE: /run/admin/admin_password
      SESSION_COOKIE_SECURE: "1"    # ログインの Cookie を HTTPS のときだけ送る（Caddy が HTTPS にしている）
      # ミニゲーム（下の dya）のカードをトップに出すか。remote-setup.sh が .env に書く。
      DYA_ENABLED: ${DYA_ENABLED:-0}
      # ミニゲーム（下の osero）のカードをトップのメニューに出すか。remote-setup.sh が .env に書く。
      OSERO_ENABLED: ${OSERO_ENABLED:-0}
    extra_hosts:
      # app コンテナから、ホストで動く Tor（SOCKS 9050）へ届かせるため
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/data
      - ./admin_password:/run/admin/admin_password:ro
    expose:
      - "8080"

  # ミニゲーム「ダイナマイト野球」（このリポジトリの dya/。tenma2066-tech/dya-proxy の写し）。Caddy が /dya/ をここへ回す。
  # profile "dya" のときだけ起動する（remote-setup.sh が、ソースと暗証番号がそろったときに COMPOSE_PROFILES=dya を .env に書く）。
  # お店の注文・台帳・データの置き場所には触れない（volumes なし）。
  dya:
    profiles: ["dya"]
    build: ./src/dya
    restart: unless-stopped
    environment:
      PORT: "8080"
      PROXY_AUTH_PIN: ${DYA_PIN:-}   # Render と同じ暗証番号。空なら profile が付かず起動しない＝必ず暗証番号が要る
      DYA_BASE_PATH: /dya
      DYA_DATA_DIR: /app/data
      # 人対人オンライン対戦の独立化のため、対戦サーバとの socket.io フレームを採取する。
      # 既定で有効。採取物は PIN 付きの /dya/__capture で取り出せる（/dya/__capture/clear で消去）。
      # 止めたいときは .env に DYA_WS_CAPTURE=0 を書く。
      DYA_WS_CAPTURE: ${DYA_WS_CAPTURE:-1}
      # 独立マッチサーバ: 1 で対戦も本家不要（この VPS 上の players 同士で対戦）。
      # 既定 0（本家 sv2.splaxserver.net 接続）。実行中に /dya/__localmatch?on=1 で切替可。
      DYA_LOCAL_MATCH: ${DYA_LOCAL_MATCH:-0}
      # セッション別 Tor: 本家への中継を host の Tor(SOCKS5) 経由にし、利用者ごとに
      # 別の出口IPにする（本家の「同一IP=同一ID」制限よけ）。app と同じホスト Tor を使う。
      # DYA_TOR=1 で既定 ON。実行中に /dya/__tor?on=1 で切替可（既定は OFF）。
      DYA_SOCKS_URL: "socks5h://host.docker.internal:9050"
      DYA_TOR: ${DYA_TOR:-0}
    extra_hosts:
      # dya コンテナから、ホストで動く Tor(SOCKS 9050) へ届かせるため（app と同じ）
      - "host.docker.internal:host-gateway"
    volumes:
      # 採取した対戦プロトコル（ws_capture/*.jsonl）の置き場所。お店のデータとは別ディレクトリ。
      - ./dya-data:/app/data
    expose:
      - "8080"

  # ミニゲーム「UltraOSERO」（このリポジトリの osero/。最大6人オセロ・自前サーバ）。Caddy が /osero/ をここへ回す。
  # profile "osero" のときだけ起動する（remote-setup.sh が、ソースがそろったときに COMPOSE_PROFILES へ osero を足す）。
  # 外部通信なし・暗証番号なし。お店の注文・台帳・データには触れない（戦績だけ osero-data に保存）。
  osero:
    profiles: ["osero"]
    build: ./src/osero
    restart: unless-stopped
    environment:
      PORT: "8080"
      OSERO_DATA_DIR: /app/data
    volumes:
      # 戦績・レート（stats.json）。コンテナは node ユーザ（uid 1000）で動くので、remote-setup.sh が持ち主を合わせる
      - ./osero-data:/app/data
    expose:
      - "8080"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_HOST: ${SITE_HOST}
    extra_hosts:
      # 同じサーバーの systemd で動く xbot（管理サイト）に転送するため
      - "host.docker.internal:host-gateway"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy-sites:/etc/caddy/sites:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:

networks:
  default:
    driver_opts:
      # VPS のネットワーク（MTU 1442 など）より大きいと、TLS の接続で大きなパケットが捨てられて通信が止まる
      com.docker.network.driver.mtu: "1400"
