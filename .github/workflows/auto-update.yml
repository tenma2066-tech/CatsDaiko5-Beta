name: bcsfe 自動更新

on:
  push:
    branches: [main]
    paths:
      - "app.py"
      - "auth_store.py"
      - "github_auth_store.py"
      - "engine.py"
      - "selftest.py"
      - "save_audit.py"
      - "save_repair.py"
      - "test_save_repair.py"
      - "test_save_audit.py"
      - "test_parallel.py"
      - "test_improvements.py"
      - "test_cat_customization.py"
      - "test_github_auth_store.py"
      - "smoke_bcsfe.py"
      - "requirements.txt"
      - ".github/workflows/auto-update.yml"
  schedule:
    # 毎週月曜 12:00（日本時間）
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bcsfe-auto-update
  cancel-in-progress: false

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Pythonを準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.8"
          cache: pip

      - name: 現在の依存関係をインストール
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: PyPIの最新版を確認
        id: check
        run: python scripts/check_bcsfe_update.py

      - name: 更新版bcsfeをインストール
        if: steps.check.outputs.upgrade == 'true'
        run: python -m pip install --upgrade "bcsfe==${{ steps.check.outputs.latest }}"

      - name: bcsfe API互換性テスト
        run: python smoke_bcsfe.py

      - name: アプリ自己テスト
        run: python selftest.py

      - name: セーブデータ構造監査テスト
        run: python -m unittest -v test_save_audit.py

      - name: エラーキャラ修復テスト
        run: python -m unittest -v test_save_repair.py

      - name: 並列実行テスト
        run: python -m unittest -v test_parallel.py

      - name: 管理者と改善機能のテスト
        run: python -m unittest -v test_improvements.py

      - name: キャラ個別カスタマイズテスト
        run: python -m unittest -v test_cat_customization.py

      - name: GitHubパスワード保存テスト
        run: python -m unittest -v test_github_auth_store.py

      - name: requirements.txtを更新
        if: steps.check.outputs.upgrade == 'true'
        env:
          BCSFE_LATEST: ${{ steps.check.outputs.latest }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("requirements.txt")
          text = path.read_text(encoding="utf-8")
          updated, count = re.subn(
              r"(?m)^bcsfe==[0-9][0-9.]*$",
              f"bcsfe=={os.environ['BCSFE_LATEST']}",
              text,
          )
          if count != 1:
              raise SystemExit(f"bcsfe pinned line count must be 1, got {count}")
          path.write_text(updated, encoding="utf-8")
          PY

      - name: 変更をコミット
        if: steps.check.outputs.upgrade == 'true'
        run: |
          if git diff --quiet -- requirements.txt; then
            echo "requirements.txt に変更はありません"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add requirements.txt
          git commit -m "chore: update bcsfe to ${{ steps.check.outputs.latest }}"
          git push origin main
