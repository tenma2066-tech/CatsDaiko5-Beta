name: bcsfe 自動更新

on:
  push:
    branches: [main]
    paths:
      - "app.py"
      - "templates/**"
      - "pricing.py"
      - "engine.py"
      - "item_catalog.py"
      - "selftest.py"
      - "save_audit.py"
      - "save_repair.py"
      - "test_save_repair.py"
      - "test_save_audit.py"
      - "test_parallel.py"
      - "test_improvements.py"
      - "test_cat_customization.py"
      - "smoke_bcsfe.py"
      - "requirements.txt"
      - ".github/workflows/auto-update.yml"
  schedule:
    # 毎週月曜 12:00（日本時間）
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write   # 新しい版の確認用ブランチを作る（main には書かない）
  issues: write     # 「新しい版があります」とお知らせ（Issue）を出す

concurrency:
  group: bcsfe-auto-update
  cancel-in-progress: false

jobs:
  check-and-update:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Pythonを準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 現在の依存関係をインストール
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: PyPIの最新版を確認
        id: check
        run: python scripts/check_bcsfe_update.py

      - name: 更新版bcsfeをインストール
        if: steps.check.outputs.upgrade == 'true'
        run: python -m pip install --upgrade "bcsfe==${{ steps.check.outputs.latest }}"

      - name: bcsfe API互換性テスト
        run: python smoke_bcsfe.py

      - name: アプリ自己テスト
        run: python selftest.py

      - name: セーブデータ構造監査テスト
        run: python -m unittest -v test_save_audit.py

      - name: エラーキャラ修復テスト
        run: python -m unittest -v test_save_repair.py

      - name: 並列実行テスト
        run: python -m unittest -v test_parallel.py

      - name: 管理者と改善機能のテスト
        run: python -m unittest -v test_improvements.py

      - name: キャラ個別カスタマイズテスト
        run: python -m unittest -v test_cat_customization.py

      - name: 種類ごとの数量指定テスト
        run: python -m unittest -v test_item_types.py


      - name: requirements.txtを更新
        if: steps.check.outputs.upgrade == 'true'
        env:
          BCSFE_LATEST: ${{ steps.check.outputs.latest }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("requirements.txt")
          text = path.read_text(encoding="utf-8")
          updated, count = re.subn(
              r"(?m)^bcsfe==[0-9][0-9.]*$",
              f"bcsfe=={os.environ['BCSFE_LATEST']}",
              text,
          )
          if count != 1:
              raise SystemExit(f"bcsfe pinned line count must be 1, got {count}")
          path.write_text(updated, encoding="utf-8")
          PY

      - name: 確認用のブランチに置いて、お知らせを出す（main には自動で入れない）
        if: steps.check.outputs.upgrade == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.check.outputs.latest }}
        run: |
          if git diff --quiet -- requirements.txt; then
            echo "requirements.txt に変更はありません"
            exit 0
          fi
          BR="auto/bcsfe-$VER"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BR"
          git add requirements.txt
          git commit -m "chore: bcsfe を $VER に更新（テスト通過・確認待ち）"
          git push -f origin "$BR"
          TITLE="bcsfe $VER が出ました（テスト通過・本番には未反映）"
          if ! curl -fsS -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$GITHUB_REPOSITORY/issues?state=open&per_page=50" | grep -qF "\"title\": \"$TITLE\""; then
            BODY="セーブ編集ライブラリ bcsfe の新しい版 $VER が出ました。自動テスト（smoke・selftest・単体テスト）は通っています。\n\nブランチ \`$BR\` に用意しました。本番に入れるときは、このブランチの requirements.txt の変更を main に入れてください（入れると本番に反映されます）。\n\n自動で main に入れないのは、人が確認しないまま本番のライブラリが変わるのを防ぐためです（docs/AUDIT_PLAN.md S6）。"
            python3 -c 'import json,os,sys; print(json.dumps({"title": sys.argv[1], "body": sys.argv[2].replace("\\n", "\n")}))' "$TITLE" "$BODY" > /tmp/issue.json
            curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/issues" -d @/tmp/issue.json >/dev/null
          fi
          echo "::notice::bcsfe $VER をブランチ $BR に用意しました（main には入れていません）"
