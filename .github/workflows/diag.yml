name: Payment diagnostics
# 保留まわりの調査用。状態コード・金額・経過時間だけを出す（リンク・名前・IDは出さない）。
on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Dump sanitized ledger states
        run: |
          APP=$(sed -n 's/^app *= *"\([^"]*\)".*/\1/p' fly.toml | head -1)
          flyctl ssh console -a "$APP" -C "sh -c 'echo  | base64 -d | python3'"
