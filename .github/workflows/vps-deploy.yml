name: Deploy to VPS
# 国内VPS（Ubuntu）へ、SSH（パスワードまたは鍵）でデプロイする。
# 必要なシークレット: VPS_HOST（IPアドレス）, ADMIN_PASSWORD, VPS_PASSWORD（または VPS_SSH_KEY）
# 任意: VPS_USER（既定 root）, SITE_DOMAIN（独自ドメイン。なければ <IP>.sslip.io で自動HTTPS）
on:
  push:
    branches: [main]
    # 配布条件や Docker 除外設定だけを更新した時の反映は workflow_dispatch を使う。
    paths-ignore: [".dockerignore", ".github/workflows/vps-deploy.yml", "**.md", "docs/**", ".github/workflows/vps-diag.yml", ".github/workflows/diag.yml", "exchange/**", ".github/workflows/exchange-deploy.yml", "xbot/**", ".github/workflows/xbot-*.yml", ".github/workflows/health-watch.yml"]
  workflow_dispatch:
    inputs:
      allow_running:
        description: "止まったまま終わらない実行の件数（通常は0。0以外にするとその件数の実行を止めて入れ替える）"
        required: false
        default: "0"

concurrency: vps-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        env:
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          if [ -z "$VPS_HOST" ]; then echo "::notice::VPS_HOST が未登録のため、VPSへのデプロイは行いません（登録後に実行されます）"; echo "SKIP=true" >> "$GITHUB_ENV"; exit 0; fi
          [ -n "$ADMIN_PASSWORD" ] || { echo "::error::シークレット ADMIN_PASSWORD を登録してください"; exit 1; }
          if [ -z "$VPS_PASSWORD" ] && [ -z "$VPS_SSH_KEY" ]; then echo "::error::シークレット VPS_PASSWORD（または VPS_SSH_KEY）を登録してください"; exit 1; fi
      - name: Prepare SSH
        if: env.SKIP != 'true'
        env:
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          SITE_DOMAIN: ${{ secrets.SITE_DOMAIN }}
        run: |
          set -eu
          U="${VPS_USER:-root}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          OPTS="-o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 -o ConnectTimeout=20"
          if [ -n "$VPS_SSH_KEY" ]; then
            printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/id_vps; chmod 600 ~/.ssh/id_vps
            echo "SSH_CMD=ssh -i $HOME/.ssh/id_vps $OPTS" >> "$GITHUB_ENV"
          else
            sudo apt-get install -y sshpass >/dev/null
            echo "SSH_CMD=sshpass -e ssh -o PreferredAuthentications=password -o PubkeyAuthentication=no $OPTS" >> "$GITHUB_ENV"
            echo "USE_SSHPASS=1" >> "$GITHUB_ENV"
          fi
          echo "TARGET=$U@$VPS_HOST" >> "$GITHUB_ENV"
          echo "SUDO=$([ "$U" = root ] && echo '' || echo 'sudo')" >> "$GITHUB_ENV"
          if [ -n "$SITE_DOMAIN" ]; then echo "SITE_HOST=$SITE_DOMAIN" >> "$GITHUB_ENV"; else echo "SITE_HOST=$(echo "$VPS_HOST" | tr '.' '-').sslip.io" >> "$GITHUB_ENV"; fi
      - name: Test connection
        if: env.SKIP != 'true'
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          if ! $SSH_CMD "$TARGET" 'echo connected; id -un; lsb_release -ds 2>/dev/null || true; free -m | sed -n 2p'; then
            echo "::error::サーバーにSSHで入れません。次を確認してください: (1) VPS_HOST のIPアドレス (2) ユーザー名（既定 root。VPS_USER で変更） (3) パスワード (4) サーバー管理画面のパケットフィルターで 22番(SSH) を許可"
            exit 1
          fi
      - name: Upload source
        if: env.SKIP != 'true'
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          set -eu
          NEW="/tmp/catsdaiko-src-$GITHUB_RUN_ID"
          echo "NEW_SRC=$NEW" >> "$GITHUB_ENV"
          tar czf - --exclude=.git --exclude=./exchange . | $SSH_CMD "$TARGET" "rm -rf $NEW && mkdir -p $NEW && tar xzf - -C $NEW"
      - name: Setup and start on server
        if: env.SKIP != 'true'
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          set -eu
          AF="/tmp/.ap-$GITHUB_RUN_ID"
          printf '%s' "$ADMIN_PASSWORD" | $SSH_CMD "$TARGET" "umask 077; cat > $AF"
          # sudo を使うユーザーの場合は、同じパスワードを標準入力で渡す（root なら不要）
          if [ -n "$SUDO" ] && [ -n "${USE_SSHPASS:-}" ]; then
            printf '%s\n' "$SSHPASS" | $SSH_CMD "$TARGET" "sudo -S -p '' bash $NEW_SRC/deploy/vps/remote-setup.sh '$SITE_HOST' '$NEW_SRC' '$AF'"
          else
            AR="${{ github.event.inputs.allow_running || '0' }}"; case "$AR" in ''|*[!0-9]*) AR=0;; esac
            $SSH_CMD "$TARGET" "ALLOW_RUNNING=$AR $SUDO bash $NEW_SRC/deploy/vps/remote-setup.sh '$SITE_HOST' '$NEW_SRC' '$AF'"
          fi
      - name: Health check
        if: env.SKIP != 'true'
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          # GitHub のサーバー（海外）から 443 番が届かない場合があるため、外からの確認とサーバー内からの確認を両方行う
          for i in $(seq 1 18); do
            if curl -fsS -m 10 "https://$SITE_HOST/health" >/dev/null 2>&1; then echo "OK (外から): https://$SITE_HOST/"; exit 0; fi
            IN=$($SSH_CMD "$TARGET" "curl -s -m 5 -o /dev/null -w '%{http_code}' --resolve $SITE_HOST:443:127.0.0.1 https://$SITE_HOST/health" 2>/dev/null || true)
            HTTP=$(curl -s -m 10 -o /dev/null -w '%{http_code}' "http://$SITE_HOST/health" || true)
            if [ "$IN" = "200" ] && [ "$HTTP" = "308" ]; then
              echo "OK (サーバー内からの HTTPS 確認: 200 / 外からの HTTP: 308)"
              echo "::notice::サイトは起動しています。GitHub（海外）からは 443 番に届きませんでした。国内からは開けるはずです: https://$SITE_HOST/"
              exit 0
            fi
            sleep 10
          done
          echo "::warning::サイトの起動を確認できません（サーバー内 HTTPS: ${IN:-?} / 外から HTTP: ${HTTP:-?}）。サーバー管理画面のパケットフィルターで 80番・443番 を許可しているか確認してください。"
          $SSH_CMD "$TARGET" "cd /opt/catsdaiko && docker compose ps && docker compose logs --tail 25 app" 2>&1 | tail -40 || true
          exit 1
