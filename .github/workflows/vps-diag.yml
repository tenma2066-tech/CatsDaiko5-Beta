name: VPS diagnostics
# 調査用。注文・決済の状態（状態名・金額・経過時間・メモ）だけを出す。リンク・引継ぎコード・名前は出さない。
on:
  workflow_dispatch:
  push:
    branches: [claude/zealous-ritchie-5o2epn]
    paths: [".github/workflows/vps-diag.yml"]

jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      SSHPASS: ${{ secrets.VPS_PASSWORD }}
    steps:
      - name: Dump sanitized states
        run: |
          sudo apt-get install -y sshpass >/dev/null
          cat > /tmp/d.py <<'PY'
          import sqlite3, time
          db = sqlite3.connect("/data/paypay/payments.sqlite3"); db.row_factory = sqlite3.Row; now = time.time()
          for r in db.execute("SELECT * FROM history ORDER BY created DESC LIMIT 40"):
              d = dict(r)
              print("H", d["order_id"][:5], "u=" + str(d["user_id"])[:4], "age_min=%d" % ((now - d["created"]) / 60), "upd_min=%d" % ((now - d["updated"]) / 60),
                    "state=" + str(d["state"]), "amt=" + str(d["amount"]), "diag=" + str(d["diag"]))
          PY
          sed -i 's/^          //' /tmp/d.py
          sshpass -e ssh -o StrictHostKeyChecking=accept-new -o PreferredAuthentications=password -o PubkeyAuthentication=no "root@$VPS_HOST" \
            "cd /opt/catsdaiko && docker compose exec -T app python3 -" < /tmp/d.py
          sshpass -e ssh -o StrictHostKeyChecking=accept-new -o PreferredAuthentications=password -o PubkeyAuthentication=no "root@$VPS_HOST" \
            "cd /opt/catsdaiko && echo '--- app log (tail) ---' && docker compose logs --tail 60 app 2>&1 | cut -c1-220 && echo '--- processes ---' && docker compose top app 2>&1 | cut -c1-200 && echo '--- stats ---' && docker stats --no-stream 2>&1 | cut -c1-160 && echo '--- disk/mem ---' && df -h / | tail -1 && free -m | sed -n 2p" || true
      - name: Network check (MTU and HTTPS to the game upload host)
        run: |
          cat > /tmp/n.sh <<'SH'
          echo "--- host MTU ---"; ip -o link | awk '{print $2, $4, $5}' | grep -v "^lo"
          echo "--- docker network MTU ---"; docker network inspect catsdaiko_default --format '{{json .Options}}'
          for host in nyanko-service-data-prd.s3.amazonaws.com s3.ap-northeast-1.amazonaws.com nyanko-backups.ponosgames.com www.google.com; do
            printf "host %-40s " "$host"; curl -s -o /dev/null -m 15 -w "code=%{http_code} connect=%{time_connect} tls=%{time_appconnect} total=%{time_total}\n" "https://$host/" || echo "FAILED(rc=$?)"
          done
          echo "--- same from inside the app container ---"
          cd /opt/catsdaiko
          docker compose exec -T app python3 - <<'PY'
          import time, requests
          for h in ["nyanko-service-data-prd.s3.amazonaws.com","s3.ap-northeast-1.amazonaws.com","nyanko-backups.ponosgames.com","www.google.com"]:
              t=time.time()
              try:
                  r=requests.get("https://"+h+"/", timeout=(10,15)); print("container", h, r.status_code, "%.1fs"%(time.time()-t))
              except Exception as e:
                  print("container", h, "FAIL", type(e).__name__, "%.1fs"%(time.time()-t))
          PY
          SH
          sed -i 's/^          //' /tmp/n.sh
          sshpass -e ssh -o StrictHostKeyChecking=accept-new -o PreferredAuthentications=password -o PubkeyAuthentication=no "root@$VPS_HOST" "bash -s" < /tmp/n.sh 2>&1 | head -40 || true
      - name: Stack of the running worker (read-only, no local variables)
        run: |
          cat > /tmp/s.sh <<'SH'
          cd /opt/catsdaiko
          docker run --rm --pid=container:catsdaiko-app-1 --cap-add SYS_PTRACE python:3.12-slim sh -c '
            pip install -q py-spy >/dev/null 2>&1
            for p in /proc/[0-9]*; do
              if tr "\0" " " < $p/cmdline 2>/dev/null | grep -q spawn_main; then echo "== worker pid ${p#/proc/} =="; py-spy dump --pid ${p#/proc/} 2>&1 | head -60; fi
            done'
          SH
          sed -i 's/^          //' /tmp/s.sh
          sshpass -e ssh -o StrictHostKeyChecking=accept-new -o PreferredAuthentications=password -o PubkeyAuthentication=no "root@$VPS_HOST" "bash -s" < /tmp/s.sh 2>&1 | cut -c1-220 | head -80 || true

