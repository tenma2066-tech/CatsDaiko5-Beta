name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: BCSFE API compatibility
        run: python smoke_bcsfe.py

      - name: Application self-test
        run: python selftest.py

      - name: Save audit tests
        run: python -m unittest -v test_save_audit.py

      - name: Save repair tests
        run: python -m unittest -v test_save_repair.py

      - name: Parallel execution tests
        run: python -m unittest -v test_parallel.py

      - name: Improvement regression tests
        run: python -m unittest -v test_improvements.py

      - name: Character customization tests
        run: python -m unittest -v test_cat_customization.py

      - name: GitHub auth store tests
        run: python -m unittest -v test_github_auth_store.py

      - name: GitHub runtime store tests
        run: python -m unittest -v test_github_runtime_store.py

      - name: PayPay gateway tests
        run: python -m unittest -v test_paypay_gateway.py

      - name: Shop store tests
        run: python -m unittest -v test_shop_store.py

      - name: Firestore repository tests
        run: python -m unittest -v test_firestore_repository.py
