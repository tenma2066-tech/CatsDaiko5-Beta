name: xbot deploy
# X 自動化ツール（xbot）を VPS に入れる / 更新する。手動でだけ動く（push では動かない）。
# 必要なシークレット: VPS_HOST, VPS_PASSWORD, XBOT_ADMIN_PASSWORD
# step: install = 入れる・更新する（お店には触らない） / caddy = 管理サイトのURLをCaddyに追加（reloadのみ） / status = 状態を見るだけ
# 手動実行（workflow_dispatch）は main にないと使えないため、xbot/deploy/run.txt を書き換えて push したときにも動く。
#   run.txt の中身: 1行目 = step（install / caddy / status）、2行目 = domain（caddy のとき）
on:
  push:
    branches: [main]
    paths: ["xbot/deploy/run.txt"]
  workflow_dispatch:
    inputs:
      step:
        description: "install / caddy / status"
        required: true
        default: "status"
      domain:
        description: "管理サイトのドメイン（caddy のときだけ。例: tnshop-xbot.duckdns.org）"
        required: false
        default: ""

concurrency: xbot-deploy

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      SSHPASS: ${{ secrets.VPS_PASSWORD }}
      XBOT_ADMIN_PASSWORD: ${{ secrets.XBOT_ADMIN_PASSWORD }}
      STEP: ${{ github.event.inputs.step }}
      XBOT_DOMAIN: ${{ github.event.inputs.domain }}
    steps:
      - uses: actions/checkout@v4
      - name: Run
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            STEP=$(sed -n 1p xbot/deploy/run.txt | tr -d '[:space:]')
            XBOT_DOMAIN=$(sed -n 2p xbot/deploy/run.txt | tr -d '[:space:]')
          fi
          echo "step=$STEP domain=$XBOT_DOMAIN"
          sudo apt-get install -y sshpass >/dev/null
          SSH="sshpass -e ssh -o StrictHostKeyChecking=accept-new -o PreferredAuthentications=password -o PubkeyAuthentication=no root@$VPS_HOST"
          case "$STEP" in
            install)
              [ -n "$XBOT_ADMIN_PASSWORD" ] || { echo "XBOT_ADMIN_PASSWORD のシークレットがありません"; exit 1; }
              tar czf - -C xbot . | $SSH "rm -rf /tmp/xbot-src && mkdir -p /tmp/xbot-src && tar xzf - -C /tmp/xbot-src"
              printf '%s' "$XBOT_ADMIN_PASSWORD" | $SSH "read -r P; XBOT_ADMIN_PASSWORD=\"\$P\" bash /tmp/xbot-src/deploy/setup.sh /tmp/xbot-src; rc=\$?; rm -rf /tmp/xbot-src; exit \$rc"
              ;;
            caddy)
              [ -n "$XBOT_DOMAIN" ] || { echo "domain を入れてください"; exit 1; }
              $SSH "cat > /tmp/xbot-caddy-site.sh" < xbot/deploy/caddy-site.sh
              $SSH "XBOT_DOMAIN='$XBOT_DOMAIN' bash /tmp/xbot-caddy-site.sh < /dev/null; rc=\$?; rm -f /tmp/xbot-caddy-site.sh; exit \$rc"
              ;;
            status)
              $SSH "systemctl --no-pager status xbot-web xbot-worker 2>&1 | grep -E '●|Active:|Memory:' ; journalctl -u xbot-worker -n 400 --no-pager 2>&1 | grep -vE 'keysym|XKEYBOARD|xkbcomp|^.*python\[[0-9]+\]:  +' | sed -E 's/dm: .*に(ルール)/dm: *** に\1/; s/(許可しました)：.*/\1：***/; s/@[A-Za-z0-9_]{1,15}/@***/g; s/[0-9]{8,}/#/g' | tail -45 | cut -c1-260; echo '--- apt ---'; ps -eo pid,etimes,cmd | grep -E 'apt|dpkg|unattended' | grep -v grep | cut -c1-140; echo '--- listening ---'; ss -tlnp | grep -E '6080|5901|8090' ; ps -eo user,pid,rss,cmd | grep -E 'Xvfb|x11vnc|websockify|chrom' | grep -v grep | cut -c1-160; free -m | sed -n 2p; echo '--- caddy (xbot) ---'; ls /opt/catsdaiko/caddy-sites; cd /opt/catsdaiko && docker compose logs --tail 200 caddy 2>&1 | grep -iE 'tnshop-xbot|error|obtain|certificate' | tail -25 | cut -c1-300; echo '--- inside caddy ---'; docker compose exec -T caddy ls -la /etc/caddy/sites; docker compose exec -T caddy caddy adapt --config /etc/caddy/Caddyfile --adapter caddyfile 2>/dev/null | grep -o 'tnshop-xbot[a-z.]*' | sort -u; echo -n 'running config has xbot: '; docker compose exec -T caddy wget -qO- http://localhost:2019/config/ | grep -c 'tnshop-xbot'; docker inspect catsdaiko-caddy-1 --format '{{json .HostConfig.ExtraHosts}} {{range .Mounts}}{{.Source}}->{{.Destination}} {{end}}'" || true
              ;;
            probe)
              # DM画面の作りを調べる（部品の名前と数だけ。DMの本文・相手の名前は出さない）
              $SSH "cat > /tmp/xbot-probe.sh" < xbot/deploy/probe.sh
              $SSH "bash /tmp/xbot-probe.sh < /dev/null; rm -f /tmp/xbot-probe.sh"
              ;;
            dmcheck)
              $SSH "cat > /tmp/xbot-dmcheck.sh" < xbot/deploy/dmcheck.sh
              $SSH "bash /tmp/xbot-dmcheck.sh < /dev/null; rm -f /tmp/xbot-dmcheck.sh"
              ;;
            *) echo "step は install / caddy / status / probe"; exit 1;;
          esac
