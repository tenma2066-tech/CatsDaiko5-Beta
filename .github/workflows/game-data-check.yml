name: JP game-data catalog check

on:
  schedule:
    # Every Monday at 03:30 UTC (12:30 JST)
    - cron: "30 3 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/check_game_data.py"
      - "engine.py"
      - "app.py"
      - "requirements.txt"
      - ".github/workflows/game-data-check.yml"

permissions:
  contents: read

concurrency:
  group: jp-game-data-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned BCSFE
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -c constraints.txt

      - name: Build and compare the latest published JP catalog
        run: python scripts/check_game_data.py
