<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="robots" content="noindex">
<title>彩狩 -IROGARI-</title>
<style>
:root{
  --bg0:#0b1020; --bg1:#141c36; --panel:rgba(18,24,44,.82); --panel2:rgba(30,38,66,.9);
  --gold:#d9bf86; --gold2:#f3e2b8; --line:rgba(217,191,134,.42); --ink:#efe8da; --dim:#a8a493;
  --red:#ff6f61; --green:#6fd58a; --blue:#5cb2ff; --yellow:#f6d256; --purple:#bb90ff;
  --serif:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP","Times New Roman",serif;
  --sans:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(120% 90% at 50% 18%,#26335e 0%,var(--bg1) 42%,var(--bg0) 100%);color:var(--ink);font-family:var(--sans);user-select:none;-webkit-user-select:none;touch-action:manipulation}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
body.flat #gl{display:none}
.hidden{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
.serif{font-family:var(--serif);letter-spacing:.08em}

/* ---- 共通の枠 ---- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 10px 34px rgba(0,0,0,.45),inset 0 0 0 1px rgba(255,255,255,.04)}
.orn{display:flex;align-items:center;gap:10px;color:var(--gold);font-size:11px;letter-spacing:.3em}
.orn:before,.orn:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 22px;border-radius:999px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(60,70,110,.75),rgba(28,34,60,.9));color:var(--ink);font-family:var(--serif);letter-spacing:.12em;font-size:15px;transition:transform .08s,filter .15s,border-color .15s}
.btn:active{transform:scale(.97)}
.btn:hover{border-color:var(--gold2);filter:brightness(1.12)}
.btn.pri{background:linear-gradient(180deg,#f3e2b8,#c9a866);color:#2a2414;border-color:#fff3cf;font-weight:700;box-shadow:0 0 18px rgba(217,191,134,.35)}
.btn.ghost{background:rgba(18,24,44,.55)}
.btn:disabled{opacity:.4;pointer-events:none}
.btn.sm{min-height:36px;padding:0 14px;font-size:13px}
input.txt{width:100%;height:46px;border-radius:999px;border:1px solid var(--line);background:rgba(8,12,26,.7);color:var(--ink);padding:0 18px;font:inherit;font-size:16px;outline:none;text-align:center;letter-spacing:.08em}
input.txt:focus{border-color:var(--gold2)}

/* ---- 画面の切り替え ---- */
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));overflow:auto}
#title .box{width:min(440px,100%);padding:28px 22px 22px;text-align:center}
#title h1{margin:0;font-family:var(--serif);font-weight:500;font-size:46px;letter-spacing:.3em;text-indent:.3em;background:linear-gradient(180deg,#fff7df,#d9bf86 70%,#a98d55);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 14px rgba(217,191,134,.35))}
#title .sub{font-family:var(--serif);color:var(--gold);letter-spacing:.5em;text-indent:.5em;font-size:12px;margin:2px 0 6px}
#title .dots{display:flex;justify-content:center;gap:9px;margin:14px 0 18px}
.dot{width:10px;height:10px;transform:rotate(45deg);border:1px solid rgba(255,255,255,.5)}
.stack{display:grid;gap:10px;margin-top:14px}
.row{display:flex;gap:10px}.row>*{flex:1}
.note{color:var(--dim);font-size:12px;line-height:1.7;margin-top:14px}

#lobby .box{width:min(760px,100%);padding:20px 18px}
#lobby h2{margin:0 0 4px;font-family:var(--serif);font-weight:500;font-size:22px;letter-spacing:.2em}
.code{font-family:var(--serif);font-size:30px;letter-spacing:.35em;color:var(--gold2)}
.quests{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.quest{position:relative;padding:14px 10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);text-align:center;transition:.15s;overflow:hidden}
.quest:before{content:"";position:absolute;inset:0;background:radial-gradient(90% 70% at 50% 0%,var(--c),transparent 70%);opacity:.22}
.quest.on{border-color:var(--gold2);box-shadow:0 0 0 1px var(--gold2),0 0 22px rgba(217,191,134,.3);transform:translateY(-2px)}
.quest .nm{position:relative;font-family:var(--serif);font-size:19px;letter-spacing:.14em}
.quest .tt{position:relative;color:var(--dim);font-size:11px;margin-top:3px}
.quest .st{position:relative;color:var(--gold);font-size:13px;letter-spacing:.2em;margin-top:6px}
.quest .el{position:relative;display:inline-block;margin-top:6px;padding:2px 10px;border-radius:999px;font-size:11px;border:1px solid var(--c);color:var(--c)}
.members{display:grid;gap:6px;margin:10px 0}
.member{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;background:rgba(8,12,26,.5);border:1px solid rgba(255,255,255,.07);font-size:14px}
.member .tag{margin-left:auto;font-size:11px;color:var(--gold)}
.member.off{opacity:.45}
.share{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:11px;border:1px solid var(--c,var(--line));color:var(--c,var(--ink));background:rgba(8,12,26,.5)}
.rooms{display:grid;gap:6px;max-height:190px;overflow:auto;margin-top:10px}

/* ---- 戦いの画面 ---- */
#hud{position:fixed;inset:0;pointer-events:none}
#hud>*{pointer-events:auto}
#order{position:absolute;left:max(10px,env(safe-area-inset-left));top:max(10px,env(safe-area-inset-top));display:flex;flex-direction:column;gap:5px;padding:9px 8px;width:66px}
#order .lbl{font-family:var(--serif);font-size:10px;letter-spacing:.2em;color:var(--gold);text-align:center;margin-bottom:2px}
.ord{position:relative;height:30px;border-radius:8px;border:1px solid var(--c);background:linear-gradient(90deg,color-mix(in srgb,var(--c) 34%,transparent),rgba(8,12,26,.6));display:flex;align-items:center;justify-content:center;font-size:11px;font-family:var(--serif);letter-spacing:.05em;overflow:hidden;white-space:nowrap;transition:.25s}
.ord.now{height:38px;box-shadow:0 0 14px var(--c);font-size:12px;border-width:2px}
.ord.foe{border-style:double;border-width:3px}

#boss{position:absolute;top:max(10px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:min(520px,calc(100% - 180px));padding:10px 14px 9px;text-align:center}
#boss .nm{font-family:var(--serif);font-size:20px;letter-spacing:.22em;text-indent:.22em}
#boss .meta{display:flex;justify-content:center;gap:6px;margin:2px 0 6px;flex-wrap:wrap;min-height:20px}
.bar{position:relative;height:10px;border-radius:999px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.12);overflow:hidden}
.bar>i{position:absolute;inset:0 auto 0 0;width:100%;border-radius:999px;background:linear-gradient(90deg,#ff8e7c,#ffd27a);transition:width .35s cubic-bezier(.2,.8,.2,1)}
.bar>b{position:absolute;inset:0 auto 0 0;width:100%;background:rgba(255,255,255,.55);transition:width .8s .25s}
#boss .hpn{font-size:11px;color:var(--dim);margin-top:3px;letter-spacing:.05em}
#parts{display:flex;gap:6px;margin-top:8px}
.part{flex:1;padding:6px 6px 7px;border-radius:9px;border:1px solid rgba(255,255,255,.14);background:rgba(8,12,26,.55);font-size:11px;transition:.15s}
.part .bar{height:5px;margin-top:4px}.part .bar>i{background:linear-gradient(90deg,#9fd0ff,#e9f4ff)}
.part.sel{border-color:var(--gold2);box-shadow:0 0 12px rgba(217,191,134,.5);color:var(--gold2)}
.part.broken{opacity:.4;text-decoration:line-through;pointer-events:none}
#warn{position:absolute;top:calc(max(10px,env(safe-area-inset-top)) + 150px);left:50%;transform:translateX(-50%);padding:8px 18px;border-radius:999px;border:1px solid #ff8f7f;background:rgba(80,12,12,.82);color:#ffd9d2;font-size:13px;font-family:var(--serif);letter-spacing:.08em;white-space:nowrap;max-width:94vw;overflow:hidden;text-overflow:ellipsis;animation:pulse 1s infinite alternate}
@keyframes pulse{from{box-shadow:0 0 0 rgba(255,120,100,0)}to{box-shadow:0 0 22px rgba(255,120,100,.7)}}
#banner{position:absolute;top:38%;left:50%;transform:translate(-50%,-50%);font-family:var(--serif);font-size:30px;letter-spacing:.3em;text-indent:.3em;color:#fff;text-shadow:0 0 18px var(--c,#fff),0 2px 6px #000;opacity:0;white-space:nowrap;pointer-events:none}
#banner.show{animation:ban .9s ease-out forwards}
@keyframes ban{0%{opacity:0;transform:translate(-50%,-30%) scale(.9)}18%{opacity:1;transform:translate(-50%,-50%) scale(1)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-62%)}}
#log{opacity:0;position:absolute;left:50%;transform:translateX(-50%);bottom:calc(max(10px,env(safe-area-inset-bottom)) + 210px);padding:6px 16px;border-radius:999px;background:rgba(8,12,26,.72);border:1px solid rgba(255,255,255,.1);font-size:12px;color:var(--ink);white-space:nowrap;max-width:94vw;overflow:hidden;text-overflow:ellipsis;transition:opacity .3s}

#party{position:absolute;left:50%;transform:translateX(-50%);bottom:max(10px,env(safe-area-inset-bottom));display:flex;gap:7px;width:min(820px,calc(100% - 16px))}
.card{flex:1;min-width:0;padding:8px 8px 7px;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:var(--panel);position:relative;transition:.2s;overflow:hidden}
.card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.card .nm{font-family:var(--serif);font-size:14px;letter-spacing:.08em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:4px}
.card .rl{font-size:9px;color:var(--dim);padding-left:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .bar{height:8px;margin-top:5px}.card .bar>i{background:linear-gradient(90deg,#57d38a,#b9f5a8)}
.card.low .bar>i{background:linear-gradient(90deg,#ff7a6b,#ffb38a)}
.card .hpn{font-size:10px;color:var(--dim);margin-top:2px;text-align:right}
.card .bst{height:3px;margin-top:3px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden}.card .bst>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--c),#fff);transition:width .3s}
.card.full .bst{box-shadow:0 0 8px var(--c)}
.card .sts{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px;min-height:16px}
.card .own{position:absolute;right:6px;top:6px;font-size:9px;padding:1px 6px;border-radius:99px;border:1px solid var(--line);color:var(--gold);background:rgba(8,12,26,.6);max-width:50%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card.now{border-color:var(--c);box-shadow:0 0 0 1px var(--c),0 0 20px color-mix(in srgb,var(--c) 60%,transparent);transform:translateY(-6px)}
.card.ko{filter:grayscale(1) brightness(.6)}
.card.pick{border-color:var(--gold2);animation:pulse2 .7s infinite alternate;cursor:pointer}
@keyframes pulse2{to{box-shadow:0 0 18px rgba(243,226,184,.8)}}
.stc{font-size:9px;padding:1px 5px;border-radius:5px;border:1px solid;white-space:nowrap}
.stc.buff{color:#9fe6b4;border-color:rgba(159,230,180,.5);background:rgba(30,80,50,.4)}
.stc.debuff{color:#ffb0a6;border-color:rgba(255,176,166,.5);background:rgba(90,30,26,.4)}

#skills{position:absolute;right:max(10px,env(safe-area-inset-right));bottom:calc(max(10px,env(safe-area-inset-bottom)) + 118px);display:flex;align-items:flex-end;gap:10px}
.sk{position:relative;width:62px;height:62px;border-radius:50%;border:1.5px solid var(--line);background:radial-gradient(circle at 35% 28%,rgba(120,134,190,.9),rgba(22,28,52,.95) 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--serif);font-size:10px;line-height:1.15;text-align:center;padding:4px;transition:.12s}
.sk .ty{font-size:8px;letter-spacing:.1em;color:var(--gold);margin-bottom:2px;font-family:var(--sans)}
.sk.sel{border-color:var(--gold2);box-shadow:0 0 0 2px rgba(243,226,184,.5),0 0 22px rgba(243,226,184,.6);transform:translateY(-6px) scale(1.06)}
.sk.off{filter:grayscale(.9) brightness(.55)}
.sk .cdn{position:absolute;inset:0;border-radius:50%;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff;font-family:var(--serif)}
.sk.ult{width:74px;height:74px;font-size:11px;border-color:var(--c);background:radial-gradient(circle at 35% 28%,color-mix(in srgb,var(--c) 75%,#fff),rgba(22,28,52,.95) 72%)}
.sk.ult.ready{box-shadow:0 0 22px var(--c);animation:pulse3 .9s infinite alternate}
@keyframes pulse3{to{box-shadow:0 0 34px var(--c),0 0 0 3px rgba(255,255,255,.25)}}
.sk.ult .ring{position:absolute;inset:-5px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),rgba(255,255,255,.08) 0);-webkit-mask:radial-gradient(circle,transparent 62%,#000 64%);mask:radial-gradient(circle,transparent 62%,#000 64%);pointer-events:none}
#desc{position:absolute;right:max(10px,env(safe-area-inset-right));bottom:calc(max(10px,env(safe-area-inset-bottom)) + 204px);width:min(330px,calc(100% - 20px));padding:11px 14px}
#desc .nm{font-family:var(--serif);font-size:16px;letter-spacing:.12em;color:var(--gold2)}
#desc .tx{font-size:12px;line-height:1.65;color:var(--ink);margin:4px 0 9px}
#desc .how{font-size:11px;color:var(--gold)}
#clock{position:absolute;right:max(10px,env(safe-area-inset-right));top:max(10px,env(safe-area-inset-top));display:flex;gap:8px;align-items:center}
#time{min-width:54px;height:38px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:17px;padding:0 12px}
#time.hot{color:#ff9a8c;border-color:#ff9a8c}
#whose{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(max(10px,env(safe-area-inset-bottom)) + 122px);font-family:var(--serif);font-size:13px;letter-spacing:.16em;color:var(--gold2);text-shadow:0 2px 8px #000;white-space:nowrap}
.float{position:fixed;left:0;top:0;font-family:var(--serif);font-weight:700;font-size:26px;color:#fff;text-shadow:0 0 6px #000,0 2px 0 #000;pointer-events:none;white-space:nowrap;animation:fl 1s ease-out forwards;z-index:30}
.float.crit{font-size:36px;color:#ffe27a}.float.heal{color:#8df0a8}.float.adv{color:#ffb86b}.float.dis{color:#9fb6cf;font-size:20px}.float.txt{font-size:15px;font-weight:500;color:#ffe9c4}.float.psn{color:#c9a0ff}
@keyframes fl{0%{opacity:0;transform:translate(-50%,-10%) scale(.6)}15%{opacity:1;transform:translate(-50%,-60%) scale(1.15)}30%{transform:translate(-50%,-80%) scale(1)}100%{opacity:0;transform:translate(-50%,-190%)}}

/* 2D表示のときの舞台 */
#stage2d{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);display:none;flex-direction:column;align-items:center;gap:8px}
body.flat #stage2d{display:flex}
#emblem{width:min(42vw,210px);aspect-ratio:1;border-radius:50%;border:2px solid var(--c);background:radial-gradient(circle at 40% 30%,color-mix(in srgb,var(--c) 70%,#fff),color-mix(in srgb,var(--c) 30%,#0b1020) 60%,#0b1020);box-shadow:0 0 50px color-mix(in srgb,var(--c) 55%,transparent),inset 0 0 40px rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:min(16vw,84px);color:rgba(255,255,255,.92);text-shadow:0 4px 18px rgba(0,0,0,.6);transition:transform .12s,filter .12s}
#emblem.hit{transform:scale(.93) rotate(-3deg);filter:brightness(1.9)}
#emblem.rage{animation:rg .5s infinite alternate}
@keyframes rg{to{box-shadow:0 0 70px #ff5a4a,inset 0 0 40px rgba(120,0,0,.6)}}

/* 結果 */
#result .box{width:min(430px,100%);padding:28px 22px;text-align:center}
#result h2{margin:0;font-family:var(--serif);font-weight:500;font-size:40px;letter-spacing:.3em;text-indent:.3em}
#result.win h2{background:linear-gradient(180deg,#fff7df,#d9bf86);-webkit-background-clip:text;background-clip:text;color:transparent}
#result.lose h2{color:#9aa3c0}
#toast{position:fixed;left:50%;top:18%;transform:translateX(-50%);padding:9px 18px;border-radius:999px;background:rgba(8,12,26,.92);border:1px solid var(--line);font-size:13px;z-index:50;opacity:0;transition:opacity .25s;pointer-events:none;max-width:92vw;text-align:center}
#toast.show{opacity:1}
#menu{position:fixed;inset:0;background:rgba(4,6,14,.6);display:flex;align-items:center;justify-content:center;z-index:40;padding:16px}
#menu .box{width:min(340px,100%);padding:20px}

@media (max-width:700px){
  #order{flex-direction:row;width:auto;right:168px;left:8px;top:max(6px,env(safe-area-inset-top));padding:6px;overflow:hidden}
  #order .lbl{display:none}.ord{flex:1;min-width:0;height:26px;font-size:9px}.ord.now{height:26px;flex:1.5}
  #boss{top:calc(max(6px,env(safe-area-inset-top)) + 46px);width:calc(100% - 16px);padding:8px 10px}
  #boss .nm{font-size:17px}
  #clock{top:max(6px,env(safe-area-inset-top));right:6px}#time{min-width:44px;height:38px;font-size:14px;padding:0 8px}#clock .btn{display:none}
  #clock .btn.keep{display:inline-flex;min-height:38px;padding:0 10px}
  #warn{top:auto;bottom:calc(max(8px,env(safe-area-inset-bottom)) + 250px);font-size:11px}
  #party{gap:4px;width:calc(100% - 8px)}.card{padding:6px 4px 5px}.card .nm{font-size:11px}.card .rl{display:none}.card .hpn{font-size:8px}.card .own{display:none}.stc{font-size:8px;padding:0 3px}
  #skills{right:50%;transform:translateX(50%);bottom:calc(max(8px,env(safe-area-inset-bottom)) + 104px);gap:8px}
  .sk{width:56px;height:56px;font-size:9px}.sk.ult{width:64px;height:64px;font-size:10px}
  #desc{right:50%;transform:translateX(50%);bottom:calc(max(8px,env(safe-area-inset-bottom)) + 178px)}
  #whose{bottom:calc(max(8px,env(safe-area-inset-bottom)) + 88px);font-size:10px}
  #log{bottom:calc(max(8px,env(safe-area-inset-bottom)) + 226px);font-size:10px}
  #banner{font-size:22px}
  #title h1{font-size:38px}.quests{gap:6px}.quest .nm{font-size:15px}
}
</style>
</head>
<body>
<canvas id="gl"></canvas>

<!-- タイトル -->
<div id="title" class="screen">
  <div class="box panel">
    <div class="sub">FIVE COLORS HUNT</div>
    <h1>彩狩</h1>
    <div class="dots"><i class="dot" style="background:var(--red)"></i><i class="dot" style="background:var(--green)"></i><i class="dot" style="background:var(--blue)"></i><i class="dot" style="background:var(--yellow)"></i><i class="dot" style="background:var(--purple)"></i></div>
    <div class="orn">◆ ハンター名 ◆</div>
    <div class="stack">
      <input id="name" class="txt" maxlength="12" placeholder="なまえ（12文字まで）" autocomplete="off">
      <button id="bSolo" class="btn pri">ひとりで狩る</button>
      <div class="row"><button id="bQuick" class="btn">すぐ入る</button><button id="bMake" class="btn">部屋を作る</button></div>
      <div class="row"><input id="code" class="txt" inputmode="numeric" maxlength="4" placeholder="合言葉（4けた）"><button id="bJoin" class="btn" style="flex:.7">入る</button></div>
    </div>
    <div id="roomList" class="rooms"></div>
    <div class="note">5色のハンターで大型モンスターを狩るターン制バトル。<br>1〜5人。人数に合わせてハンターを分けて操作します。</div>
  </div>
</div>

<!-- 部屋 -->
<div id="lobby" class="screen hidden">
  <div class="box panel">
    <div class="orn">◆ 狩りの準備 ◆</div>
    <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:8px">
      <div><h2>依頼をえらぶ</h2><div class="note" style="margin:0" id="lobbyHint"></div></div>
      <div style="text-align:right"><div class="note" style="margin:0">合言葉</div><div class="code" id="roomCode">----</div></div>
    </div>
    <div class="quests" id="quests"></div>
    <div class="orn">◆ なかま ◆</div>
    <div class="members" id="members"></div>
    <div class="row" style="margin-top:12px"><button id="bLeave" class="btn ghost" style="flex:.6">戻る</button><button id="bStart" class="btn pri">狩りに出る</button></div>
  </div>
</div>

<!-- 戦い -->
<div id="hud" class="hidden">
  <div id="order" class="panel"></div>
  <div id="boss" class="panel">
    <div class="nm" id="bossName"></div>
    <div class="meta" id="bossMeta"></div>
    <div class="bar"><b id="bossHpB"></b><i id="bossHp"></i></div>
    <div class="hpn" id="bossHpN"></div>
    <div id="parts"></div>
  </div>
  <div id="clock"><div id="time" class="panel">--</div><button id="bView" class="btn sm ghost keep">2D</button><button id="bMenu" class="btn sm ghost keep">☰</button></div>
  <div id="warn" class="hidden"></div>
  <div id="stage2d"><div id="emblem"></div></div>
  <div id="banner"></div>
  <div id="log"></div>
  <div id="whose"></div>
  <div id="desc" class="panel hidden"><div class="nm" id="descName"></div><div class="tx" id="descText"></div><div class="how" id="descHow"></div></div>
  <div id="skills"></div>
  <div id="party"></div>
</div>

<!-- 結果 -->
<div id="result" class="screen hidden" style="background:rgba(4,6,14,.55);z-index:35">
  <div class="box panel">
    <div class="orn">◆ 狩りの結果 ◆</div>
    <h2 id="resTitle" style="margin-top:12px"></h2>
    <div class="note" id="resText"></div>
    <div class="stack"><button id="bAgain" class="btn pri">部屋に戻る</button><button id="bQuit" class="btn ghost">タイトルへ</button></div>
  </div>
</div>

<div id="menu" class="hidden"><div class="box panel">
  <div class="orn">◆ メニュー ◆</div>
  <div class="stack"><button id="mView" class="btn">表示を切り替える（3D / 2D）</button><button id="mQuit" class="btn">狩りをやめる</button><button id="mClose" class="btn pri">とじる</button></div>
</div></div>
<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
/* =====================================================================
   彩狩 -IROGARI-  クライアント
   戦いの計算はサーバー。ここは「見せる」と「選んだ技を送る」だけ。
   ===================================================================== */
const $ = (id) => document.getElementById(id);
const EL = { red: '#ff6f61', green: '#6fd58a', blue: '#5cb2ff', yellow: '#f6d256', purple: '#bb90ff' };
const TYPE = { phys: '物理', spec: '特殊', guard: '防御', heal: '回復', debuff: '妨害' };
const GLYPH = { wolf: '狼', lizard: '蜥', beast: '獣' };
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };

let ws = null, me = null, defs = null, room = null, st = null, timeOff = 0;
let sel = { si: -1, part: 'm' };          // 選んでいる技と、ねらう部位
let queue = [], playing = false, disp = {}; // 演出の待ち行列と、画面に出している体力
let flat = store.get('hunt_flat') === '1';
let showTurn = null;                       // 演出の中で「いま動いている」ユニット

/* ---------------- 通信 ---------------- */
function connect() {
  const base = location.pathname.endsWith('/') ? location.pathname : location.pathname.replace(/[^/]*$/, '');
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + base + 'ws');
  ws.onopen = () => send({ t: 'hello', token: store.get('hunt_token'), name: $('name').value });
  ws.onmessage = (e) => { let m; try { m = JSON.parse(e.data); } catch (x) { return; } onMsg(m); };
  ws.onclose = () => { toast('接続が切れました。つなぎ直しています…'); setTimeout(connect, 1500); };
}
function send(o) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); }
setInterval(() => send({ t: 'ping' }), 25000);

function onMsg(m) {
  switch (m.t) {
    case 'welcome':
      me = m.id; defs = m.defs; store.set('hunt_token', m.token);
      if (!$('name').value) $('name').value = store.get('hunt_name') || '';
      if (!room) send({ t: 'rooms' });
      break;
    case 'rooms': drawRoomList(m.rooms); break;
    case 'room':
      room = m; drawLobby();
      if (m.phase === 'lobby') { st = null; queue = []; disp = {}; show('lobby'); }
      break;
    case 'state':
      timeOff = m.now - Date.now();
      st = m.state;
      if ($('hud').classList.contains('hidden')) { show('hud'); disp = {}; }
      if (!Object.keys(disp).length) { syncDisp(); if (m.events.length) rewindDisp(m.events); }
      scene3d.build(st);
      for (const e of m.events) queue.push(e);
      queue.push({ t: '_sync', state: m.state });
      pump();
      break;
    case 'left': room = null; st = null; queue = []; show('title'); send({ t: 'rooms' }); break;
    case 'error': toast(m.msg); break;
    case 'notice': toast(m.msg); break;
  }
}

/* ---------------- 画面の切り替え ---------------- */
function show(id) {
  for (const k of ['title', 'lobby', 'hud']) $(k).classList.toggle('hidden', k !== id);
  if (id !== 'hud') $('result').classList.add('hidden');
  document.body.classList.toggle('flat', flat && id === 'hud');
  scene3d.setMode(id === 'hud' ? 'battle' : 'idle');
}
let toastT = 0;
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600); }
const myName = () => { const n = $('name').value.trim(); store.set('hunt_name', n); return n; };

$('bSolo').onclick = () => { send({ t: 'name', name: myName() }); send({ t: 'create', quest: 'hibashiri', public: false }); };
$('bMake').onclick = () => { send({ t: 'name', name: myName() }); send({ t: 'create', quest: 'hibashiri', public: true }); };
$('bQuick').onclick = () => { send({ t: 'name', name: myName() }); send({ t: 'quick' }); };
$('bJoin').onclick = () => { send({ t: 'name', name: myName() }); send({ t: 'join', code: $('code').value.trim() }); };
$('bLeave').onclick = () => send({ t: 'leave' });
$('bStart').onclick = () => send({ t: 'start' });
$('bAgain').onclick = () => { if (room && room.host === me) send({ t: 'again' }); else toast('部屋を作った人が戻すのを待っています'); };
$('bQuit').onclick = $('mQuit').onclick = () => { $('menu').classList.add('hidden'); send({ t: 'leave' }); };
$('bMenu').onclick = () => $('menu').classList.remove('hidden');
$('mClose').onclick = () => $('menu').classList.add('hidden');
$('bView').onclick = $('mView').onclick = () => { flat = !flat; store.set('hunt_flat', flat ? '1' : '0'); document.body.classList.toggle('flat', flat); $('bView').textContent = flat ? '3D' : '2D'; $('menu').classList.add('hidden'); };
$('bView').textContent = flat ? '3D' : '2D';

function drawRoomList(list) {
  const box = $('roomList'); box.innerHTML = '';
  if (!list.length) return;
  const h = document.createElement('div'); h.className = 'orn'; h.textContent = '◆ 募集中の部屋 ◆'; box.appendChild(h);
  for (const r of list) {
    const q = defs.quests[r.quest];
    const b = document.createElement('button'); b.className = 'btn sm ghost'; b.style.justifyContent = 'space-between';
    b.innerHTML = `<span></span><span style="color:var(--dim);font-size:11px"></span>`;
    b.children[0].textContent = `${q.name}　${r.host}`; b.children[1].textContent = `${r.n} / 5人`;
    b.onclick = () => { send({ t: 'name', name: myName() }); send({ t: 'join', code: r.code }); };
    box.appendChild(b);
  }
}

function drawLobby() {
  if (!room || !defs) return;
  const host = room.host === me;
  $('roomCode').textContent = room.code;
  $('lobbyHint').textContent = host ? (room.public ? 'だれでも入れる部屋です' : '合言葉を知っている人だけ入れます') : '部屋を作った人が依頼をえらびます';
  const qs = $('quests'); qs.innerHTML = '';
  for (const k of Object.keys(defs.quests)) {
    const q = defs.quests[k];
    const b = document.createElement('button'); b.className = 'quest' + (room.quest === k ? ' on' : ''); b.style.setProperty('--c', EL[q.el]);
    b.innerHTML = `<div class="nm"></div><div class="tt"></div><div class="st"></div><span class="el"></span>`;
    b.children[0].textContent = q.name; b.children[1].textContent = q.title; b.children[2].textContent = '★'.repeat(q.star) + '☆'.repeat(3 - q.star); b.children[3].textContent = defs.elName[q.el] + '属性';
    b.disabled = !host; b.onclick = () => send({ t: 'quest', quest: k });
    qs.appendChild(b);
  }
  const ms = $('members'); ms.innerHTML = '';
  const n = room.players.length;
  room.players.forEach((p, i) => {
    const d = document.createElement('div'); d.className = 'member' + (p.online ? '' : ' off');
    const mine = defs.party.filter((_, k) => k % n === i);
    d.innerHTML = `<div><div class="pn"></div><div class="share"></div></div><span class="tag"></span>`;
    d.querySelector('.pn').textContent = p.name + (p.id === me ? '（あなた）' : '');
    for (const k of mine) { const h = defs.hunters[k]; const c = document.createElement('span'); c.className = 'chip'; c.style.setProperty('--c', EL[h.el]); c.textContent = `${h.name}・${h.role}`; d.querySelector('.share').appendChild(c); }
    d.querySelector('.tag').textContent = i === 0 ? '部屋主' : (p.online ? '' : '切断中');
    ms.appendChild(d);
  });
  $('bStart').disabled = !host; $('bStart').textContent = host ? '狩りに出る' : '部屋主を待っています';
  scene3d.previewQuest(defs.quests[room.quest]);
}

/* ---------------- 戦いの画面（DOM） ---------------- */
const U = (id) => st && st.units.find((u) => u.id === id);
const myIndex = () => (room ? room.players.findIndex((p) => p.id === me) : -1);
const isMine = (u) => u && u.side === 'h' && u.owner === myIndex();
const ownerName = (u) => (room && room.players[u.owner] ? room.players[u.owner].name : '');
function syncDisp() { disp = {}; if (!st) return; for (const u of st.units) { disp[u.id] = u.hp; if (u.parts) for (const p of u.parts) disp[p.id] = p.hp; } }

/* 演出の前の体力に巻き戻す（最初の表示が、結果を先に見せないように） */
function rewindDisp(events) {
  for (const e of events) {
    if (e.t === 'dmg' || e.t === 'poison') { disp[e.u] = (disp[e.u] || 0) + e.v; if (e.part) disp[e.part] = (disp[e.part] || 0) + e.v; }
    else if (e.t === 'heal') disp[e.u] = (disp[e.u] || 0) - e.v;
  }
}

function stChips(u) {
  return u.st.map((x) => { const d = defs.status[x.id]; return `<span class="stc ${d.kind}">${d.name}${x.turns < 50 ? x.turns : ''}</span>`; }).join('');
}

function drawHud() {
  if (!st || !defs) return;
  const m = U('m'), q = defs.quests[st.quest];
  $('bossName').textContent = m.name;
  $('boss').style.setProperty('--c', EL[m.el]);
  $('bossMeta').innerHTML = `<span class="chip" style="--c:${EL[m.el]}">${defs.elName[m.el]}属性</span>` + (m.rage ? '<span class="chip" style="--c:#ff7a6b">怒り</span>' : '') + stChips(m);
  const hp = disp.m == null ? m.hp : disp.m, pct = Math.max(0, hp / m.maxHp * 100);
  $('bossHp').style.width = pct + '%'; $('bossHpB').style.width = pct + '%';
  $('bossHpN').textContent = `${Math.max(0, Math.round(hp)).toLocaleString()} / ${m.maxHp.toLocaleString()}`;
  const em = $('emblem'); em.style.setProperty('--c', EL[m.el]); em.textContent = GLYPH[m.shape] || '獣'; em.classList.toggle('rage', !!m.rage);
  // 部位（ねらう場所）
  const ps = $('parts'); ps.innerHTML = '';
  const mk = (id, name, hpv, max, broken) => {
    const b = document.createElement('button'); b.className = 'part' + (sel.part === id ? ' sel' : '') + (broken ? ' broken' : '');
    b.innerHTML = `<span></span>` + (max ? `<div class="bar"><i style="width:${Math.max(0, hpv / max * 100)}%"></i></div>` : '');
    b.firstChild.textContent = name; b.onclick = () => { sel.part = id; drawHud(); };
    ps.appendChild(b);
  };
  mk('m', '本体をねらう', 0, 0, false);
  for (const p of m.parts) mk(p.id, p.name, disp[p.id] == null ? p.hp : disp[p.id], p.maxHp, p.broken);
  if (m.parts.find((p) => p.id === sel.part && p.broken)) sel.part = 'm';
  $('warn').classList.toggle('hidden', !m.charging);
  if (m.charging) $('warn').textContent = '⚠ 大技の予告！ 守りを固めよう';

  // 行動順
  const od = $('order'); od.innerHTML = '<div class="lbl">行動順</div>';
  st.order.forEach((id, i) => { const u = U(id); if (!u) return; const d = document.createElement('div'); d.className = 'ord' + (i === 0 ? ' now' : '') + (u.side === 'm' ? ' foe' : ''); d.style.setProperty('--c', EL[u.el]); d.textContent = u.name; od.appendChild(d); });

  // 味方のカード
  const pa = $('party'); pa.innerHTML = '';
  const cur = U(st.turn), sk = cur && sel.si >= 0 ? defs.hunters[cur.key].skills[sel.si] : null;
  const picking = sk && sk.target === 'ally' && isMine(cur) && !playing;
  for (const u of st.units.filter((x) => x.side === 'h')) {
    const hpv = disp[u.id] == null ? u.hp : disp[u.id], p = Math.max(0, hpv / u.maxHp * 100);
    const d = document.createElement('div');
    d.className = 'card' + ((playing ? showTurn : st.turn) === u.id ? ' now' : '') + (hpv <= 0 ? ' ko' : '') + (p < 35 ? ' low' : '') + (u.burst >= 100 ? ' full' : '') + (picking && hpv > 0 ? ' pick' : '');
    d.id = 'card_' + u.id; d.style.setProperty('--c', EL[u.el]);
    d.innerHTML = `<div class="nm"></div><div class="rl"></div><div class="bar"><i style="width:${p}%"></i></div><div class="hpn">${Math.max(0, Math.round(hpv))} / ${u.maxHp}</div><div class="bst"><i style="width:${u.burst}%"></i></div><div class="sts">${stChips(u)}</div>` + (room && room.players.length > 1 ? `<span class="own"></span>` : '');
    d.querySelector('.nm').textContent = u.name; d.querySelector('.rl').textContent = `${defs.elName[u.el]}・${u.role}`;
    const ow = d.querySelector('.own'); if (ow) ow.textContent = isMine(u) ? 'あなた' : ownerName(u);
    if (picking && hpv > 0) d.onclick = () => fire(u.id);
    pa.appendChild(d);
  }
  drawSkills();
}

function drawSkills() {
  const box = $('skills'); box.innerHTML = '';
  const cur = st && U(st.turn);
  const can = cur && isMine(cur) && st.phase === 'input' && !playing;
  $('whose').textContent = !st || st.phase !== 'input' || playing ? '' : (can ? `◆ ${cur.name} の番 ◆` : (cur ? `${cur.name}（${cur.side === 'h' ? ownerName(cur) : ''}）の番を待っています` : ''));
  if (!can) { $('desc').classList.add('hidden'); sel.si = -1; return; }
  const sks = defs.hunters[cur.key].skills;
  sks.forEach((sk, i) => {
    const cd = cur.cds[i], notReady = sk.burst && cur.burst < 100, off = cd > 0 || notReady;
    const b = document.createElement('button');
    b.className = 'sk' + (sk.burst ? ' ult' + (cur.burst >= 100 ? ' ready' : '') : '') + (sel.si === i ? ' sel' : '') + (off ? ' off' : '');
    b.style.setProperty('--c', EL[cur.el]); b.style.setProperty('--p', cur.burst);
    b.innerHTML = `<span class="ty">${sk.burst ? '奥義' : TYPE[sk.type]}</span><span></span>` + (sk.burst ? '<i class="ring"></i>' : '') + (cd > 0 ? `<span class="cdn">${cd}</span>` : '');
    b.children[1].textContent = sk.name;
    b.onclick = () => {
      if (sel.si === i && !off) { if (sk.target !== 'ally') fire(sk.target === 'enemy' ? sel.part : null); return; }
      sel.si = i; drawHud();
    };
    box.appendChild(b);
  });
  const d = $('desc');
  if (sel.si < 0) { d.classList.add('hidden'); return; }
  const sk = sks[sel.si], cd = cur.cds[sel.si];
  d.classList.remove('hidden');
  $('descName').textContent = `${sk.name}　〔${sk.burst ? '奥義' : TYPE[sk.type]}〕`;
  $('descText').textContent = sk.desc + (sk.cd ? `　（使ったあと ${sk.cd} ターン待ち）` : '');
  $('descHow').textContent = cd > 0 ? `あと ${cd} ターンで使えます` : sk.burst && cur.burst < 100 ? `奥義ゲージ ${cur.burst} / 100` : sk.target === 'ally' ? '▶ 回復する味方のカードをタップ' : '▶ もう一度タップで発動';
}

function fire(target) {
  const cur = st && U(st.turn);
  if (!cur || sel.si < 0) return;
  send({ t: 'act', u: cur.id, si: sel.si, target });
  sel.si = -1; $('desc').classList.add('hidden'); $('skills').innerHTML = '';
}

setInterval(() => {
  const t = $('time');
  if (!st || !st.deadline || st.phase !== 'input' || playing) { t.textContent = '--'; t.classList.remove('hot'); return; }
  const left = Math.max(0, Math.ceil((st.deadline - (Date.now() + timeOff)) / 1000));
  t.textContent = left; t.classList.toggle('hot', left <= 10);
}, 250);

/* ---------------- 演出（起きたことを順番に見せる） ---------------- */
function pos(id) {
  if (!flat) { const p = scene3d.screenPos(id); if (p) return p; }
  const el = id === 'm' || /^p\d/.test(id) ? $('emblem') : $('card_' + id);
  if (!el) return { x: innerWidth / 2, y: innerHeight / 2 };
  const r = el.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height * (id === 'm' ? 0.5 : 0.2) };
}
function float(id, text, cls) {
  const p = pos(id), d = document.createElement('div'); d.className = 'float ' + (cls || ''); d.textContent = text;
  d.style.left = (p.x + (Math.random() * 40 - 20)) + 'px'; d.style.top = (p.y + (Math.random() * 16 - 8)) + 'px';
  document.body.appendChild(d); setTimeout(() => d.remove(), 1000);
}
function banner(text, color) { const b = $('banner'); b.textContent = text; b.style.setProperty('--c', color || '#fff'); b.classList.remove('show'); void b.offsetWidth; b.classList.add('show'); }
function log(text) { const l = $('log'); l.textContent = text; l.style.opacity = text ? 1 : 0; }
const nameOf = (id) => { const u = U(id); return u ? u.name : ''; };

function pump() {
  if (playing) return;
  const e = queue.shift();
  if (!e) { drawHud(); return; }
  playing = true;
  const wait = playEvent(e);
  setTimeout(() => { playing = false; pump(); }, wait);
}

function playEvent(e) {
  const m = U('m');
  switch (e.t) {
    case '_sync': st = e.state; showTurn = st.turn; syncDisp(); drawHud(); scene3d.sync(st); if (st.phase === 'over') showResult(); return 0;
    case 'turn': showTurn = e.u; scene3d.focus(e.u); drawHudLight(e.u); return 220;
    case 'auto': log(`${nameOf(e.u)} は時間切れ。自動で通常攻撃`); return 300;
    case 'skill': {
      const u = U(e.u);
      banner(e.name, EL[u.el]); log(`${u.name} の ${e.name}`);
      scene3d.attack(e.u, e.targets[0], e.type, e.burst);
      return e.burst ? 900 : 620;
    }
    case 'dmg': {
      disp[e.u] = Math.max(0, (disp[e.u] || 0) - e.v);
      if (e.part) disp[e.part] = Math.max(0, (disp[e.part] || 0) - e.v);
      float(e.u, (e.crit ? '会心 ' : '') + e.v.toLocaleString(), e.crit ? 'crit' : e.em === 'adv' ? 'adv' : e.em === 'dis' ? 'dis' : '');
      if (e.em === 'adv') setTimeout(() => float(e.u, '有利！', 'txt'), 120);
      scene3d.hit(e.u, e.crit); if (e.u === 'm') { const em = $('emblem'); em.classList.add('hit'); setTimeout(() => em.classList.remove('hit'), 130); }
      drawHud(); return 330;
    }
    case 'heal': disp[e.u] = (disp[e.u] || 0) + e.v; float(e.u, '+' + e.v, 'heal'); scene3d.glow(e.u, 0x8df0a8); drawHud(); return 300;
    case 'revive': disp[e.u] = e.v; float(e.u, '復活！', 'heal'); scene3d.revive(e.u); drawHud(); return 420;
    case 'poison': disp[e.u] = Math.max(0, (disp[e.u] || 0) - e.v); float(e.u, '毒 ' + e.v, 'psn'); scene3d.hit(e.u); drawHud(); return 380;
    case 'st': if (e.st !== 'stopResist') float(e.u, defs.status[e.st].name, 'txt'); scene3d.glow(e.u, defs.status[e.st].kind === 'buff' ? 0xf3e2b8 : 0xb98cff); return 240;
    case 'resist': float(e.u, e.why === 'immune' ? '妨害無効！' : '効かない！', 'txt'); return 260;
    case 'cleanse': float(e.u, '治療', 'heal'); return 160;
    case 'skip': float(e.u, '動けない！', 'txt'); log(`${nameOf(e.u)} は停止していて動けない`); return 520;
    case 'ko': scene3d.ko(e.u); log(`${nameOf(e.u)} は倒れた…`); drawHud(); return 520;
    case 'break': banner('部位破壊！', '#f3e2b8'); log(`${e.name} を壊した！ ${m.name} はひるんでいる`); scene3d.breakPart(e.part); return 800;
    case 'rage': banner('怒り', '#ff6f61'); log(`${m.name} が怒った！ 攻撃と速さが上がる`); scene3d.rage(); return 800;
    case 'telegraph': banner('⚠ ' + e.name, '#ff6f61'); log(e.text); scene3d.charge(); $('warn').classList.remove('hidden'); $('warn').textContent = '⚠ ' + e.text; return 1100;
    case 'end': return 500;
  }
  return 0;
}
function drawHudLight(turnId) { for (const c of document.querySelectorAll('.card')) c.classList.toggle('now', c.id === 'card_' + turnId); }

function showResult() {
  const r = $('result'); r.classList.remove('hidden'); r.classList.toggle('win', !!st.win); r.classList.toggle('lose', !st.win);
  $('resTitle').textContent = st.win ? '討伐成功' : '力尽きた';
  const q = defs.quests[st.quest];
  $('resText').textContent = st.win ? `${q.name} を狩った！（${st.turns} ターン）` : `${q.name} に敗れた…（${st.turns} ターン）`;
  $('bAgain').textContent = room && room.host === me ? '部屋に戻る' : '部屋主を待つ';
}

/* =====================================================================
   3D の舞台（Three.js）。モンスターもハンターも、部品を組み合わせてコードで作る。
   ===================================================================== */
const scene3d = (() => {
  const noop = { build() {}, setMode() {}, previewQuest() {}, sync() {}, focus() {}, attack() {}, hit() {}, glow() {}, ko() {}, revive() {}, breakPart() {}, rage() {}, charge() {}, screenPos() { return null; } };
  if (!window.THREE) return noop;
  const T = THREE, canvas = $('gl');
  let renderer;
  try { renderer = new T.WebGLRenderer({ canvas, antialias: true, alpha: true, powerPreference: 'high-performance' }); } catch (e) { flat = true; return noop; }
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = T.PCFSoftShadowMap;
  const scene = new T.Scene(); scene.fog = new T.Fog(0x141c36, 14, 36);
  const cam = new T.PerspectiveCamera(42, 1, 0.1, 100);
  scene.add(new T.HemisphereLight(0xbcd0ff, 0x1a1430, 0.85));
  const sun = new T.DirectionalLight(0xfff0d0, 1.15); sun.position.set(5, 10, 6); sun.castShadow = true;
  sun.shadow.mapSize.set(1024, 1024); sun.shadow.camera.left = -9; sun.shadow.camera.right = 9; sun.shadow.camera.top = 9; sun.shadow.camera.bottom = -9; scene.add(sun);
  const rim = new T.PointLight(0x88aaff, 0.9, 20); rim.position.set(0, 4, -7); scene.add(rim);

  // 地面（円い舞台）と飾り
  const ground = new T.Mesh(new T.CylinderGeometry(9.5, 10.5, 0.6, 64), new T.MeshStandardMaterial({ color: 0x232c4a, roughness: 0.95 }));
  ground.position.y = -0.3; ground.receiveShadow = true; scene.add(ground);
  const ringM = new T.MeshBasicMaterial({ color: 0xd9bf86, transparent: true, opacity: 0.35, side: T.DoubleSide });
  for (const [r0, r1] of [[9.1, 9.2], [5.4, 5.45], [2.6, 2.64]]) { const r = new T.Mesh(new T.RingGeometry(r0, r1, 96), ringM); r.rotation.x = -Math.PI / 2; r.position.y = 0.01; scene.add(r); }
  const rockM = new T.MeshStandardMaterial({ color: 0x2e385c, roughness: 1, flatShading: true });
  for (let i = 0; i < 14; i++) { const a = i / 14 * Math.PI * 2 + 0.3, d = 10.5 + (i % 3) * 1.2; const rk = new T.Mesh(new T.DodecahedronGeometry(0.9 + (i % 4) * 0.45, 0), rockM); rk.position.set(Math.cos(a) * d, 0.5 + (i % 2) * 0.6, Math.sin(a) * d); rk.rotation.set(i, i * 2, i * 3); rk.castShadow = true; scene.add(rk); }
  // ただよう光の粒
  const pg = new T.BufferGeometry(), pn = 160, pp = new Float32Array(pn * 3);
  for (let i = 0; i < pn; i++) { pp[i * 3] = (Math.random() - 0.5) * 26; pp[i * 3 + 1] = Math.random() * 9; pp[i * 3 + 2] = (Math.random() - 0.5) * 26; }
  pg.setAttribute('position', new T.BufferAttribute(pp, 3));
  const dust = new T.Points(pg, new T.PointsMaterial({ color: 0xf3e2b8, size: 0.06, transparent: true, opacity: 0.7 })); scene.add(dust);

  const mat = (c, o) => new T.MeshStandardMaterial(Object.assign({ color: c, roughness: 0.7, metalness: 0.1, flatShading: true }, o || {}));
  const add = (g, geo, m, x, y, z, rx, ry, rz) => { const me = new T.Mesh(geo, m); me.position.set(x || 0, y || 0, z || 0); me.rotation.set(rx || 0, ry || 0, rz || 0); me.castShadow = true; g.add(me); return me; };

  /* ---- モンスター ---- */
  function buildMonster(shape, el) {
    const g = new T.Group(), c = new T.Color(EL[el]);
    const skin = mat(c.clone().multiplyScalar(0.42)), dark = mat(c.clone().multiplyScalar(0.22));
    const glow = mat(c, { emissive: c, emissiveIntensity: 0.9 });
    const eye = new T.MeshBasicMaterial({ color: 0xffffff });
    const parts = { p0: new T.Group(), p1: new T.Group() }; g.add(parts.p0, parts.p1);
    if (shape === 'wolf') {
      add(g, new T.BoxGeometry(1.5, 1.3, 3.0), skin, 0, 1.75, -0.2);
      add(g, new T.BoxGeometry(1.25, 1.15, 1.2), skin, 0, 2.25, 1.75);
      add(g, new T.ConeGeometry(0.42, 1.2, 5), dark, 0, 2.05, 2.75, Math.PI / 2);
      for (const sx of [-1, 1]) { add(g, new T.ConeGeometry(0.22, 0.6, 4), dark, sx * 0.42, 3.05, 1.55); add(g, new T.SphereGeometry(0.09, 8, 8), eye, sx * 0.4, 2.45, 2.36); }
      for (const [x, z] of [[-0.6, 0.9], [0.6, 0.9], [-0.6, -1.3], [0.6, -1.3]]) add(g, new T.CylinderGeometry(0.24, 0.18, 1.4, 6), dark, x, 0.7, z);
      add(g, new T.ConeGeometry(0.3, 1.9, 6), glow, 0, 2.3, -2.4, -Math.PI / 2.6);
      for (let i = 0; i < 7; i++) add(parts.p0, new T.ConeGeometry(0.26, 1.1 + (i % 3) * 0.3, 5), glow, (i - 3) * 0.2, 2.9, 1.2 - Math.abs(i - 3) * 0.28, -0.5);   // たてがみ
      for (const sx of [-1, 1]) for (let k = 0; k < 3; k++) add(parts.p1, new T.ConeGeometry(0.09, 0.5, 4), glow, sx * 0.6 + (k - 1) * 0.13, 0.12, 1.25, Math.PI / 2);  // 前足の爪
    } else if (shape === 'lizard') {
      const body = add(g, new T.SphereGeometry(1.3, 12, 10), skin, 0, 1.1, -0.2); body.scale.set(1.25, 0.72, 2.0);
      const head = add(g, new T.SphereGeometry(0.85, 10, 8), skin, 0, 1.25, 2.6); head.scale.set(1.1, 0.7, 1.5);
      for (const sx of [-1, 1]) { add(g, new T.SphereGeometry(0.11, 8, 8), eye, sx * 0.5, 1.6, 3.2); add(g, new T.CylinderGeometry(0.3, 0.22, 0.9, 6), dark, sx * 1.6, 0.45, 1.1, 0, 0, sx * 0.5); add(g, new T.CylinderGeometry(0.3, 0.22, 0.9, 6), dark, sx * 1.6, 0.45, -1.3, 0, 0, sx * 0.5); }
      for (let i = 0; i < 4; i++) add(parts.p0, new T.SphereGeometry(0.55 - i * 0.06, 8, 6), glow, 0, 2.05 - i * 0.05, 0.9 - i * 0.85);               // 背中のこぶ
      for (let i = 0; i < 5; i++) add(parts.p1, new T.ConeGeometry(0.62 - i * 0.1, 1.1, 6), i % 2 ? dark : glow, 0, 0.95 - i * 0.08, -2.7 - i * 0.8, -Math.PI / 2); // 尻尾
    } else {
      add(g, new T.BoxGeometry(2.3, 2.0, 3.2), skin, 0, 2.2, -0.3);
      add(g, new T.BoxGeometry(1.5, 1.4, 1.5), skin, 0, 2.6, 1.95);
      add(g, new T.BoxGeometry(1.1, 0.6, 0.9), dark, 0, 2.1, 2.85);
      for (const sx of [-1, 1]) add(g, new T.SphereGeometry(0.1, 8, 8), eye, sx * 0.5, 2.9, 2.72);
      for (const [x, z] of [[-0.85, 0.9], [0.85, 0.9], [-0.85, -1.4], [0.85, -1.4]]) add(g, new T.CylinderGeometry(0.36, 0.28, 1.5, 6), dark, x, 0.75, z);
      for (const sx of [-1, 1]) { add(parts.p0, new T.ConeGeometry(0.22, 2.0, 6), glow, sx * 0.55, 3.9, 2.2, 0.5, 0, -sx * 0.4); }                    // 雷角
      for (let i = 0; i < 5; i++) add(parts.p1, new T.OctahedronGeometry(0.42 + (i % 2) * 0.16, 0), glow, (i % 2 ? 0.45 : -0.45), 3.55, 0.8 - i * 0.6); // 蓄電器官
    }
    g.userData = { parts, glow, skin, h: shape === 'lizard' ? 2.2 : shape === 'wolf' ? 3.0 : 3.9 };
    return g;
  }

  /* ---- ハンター ---- */
  function buildHunter(key, el) {
    const g = new T.Group(), c = new T.Color(EL[el]);
    const cloak = mat(c.clone().multiplyScalar(0.75)), trim = mat(c, { emissive: c, emissiveIntensity: 0.55 }), skin = mat(0xf2d3b8), dark = mat(0x2a3050), steel = mat(0xcfd8ea, { metalness: 0.7, roughness: 0.3 });
    add(g, new T.CylinderGeometry(0.2, 0.42, 1.0, 8), cloak, 0, 0.72, 0);
    add(g, new T.SphereGeometry(0.27, 12, 10), skin, 0, 1.46, 0);
    const hair = add(g, new T.SphereGeometry(0.3, 12, 10, 0, Math.PI * 2, 0, Math.PI * 0.55), trim, 0, 1.5, 0); hair.rotation.x = 0.25;
    for (const sx of [-1, 1]) add(g, new T.CylinderGeometry(0.09, 0.1, 0.5, 6), dark, sx * 0.14, 0.25, 0);
    const w = new T.Group(); w.position.set(0.42, 1.0, -0.1); g.add(w);
    if (key === 'kagari') { add(w, new T.BoxGeometry(0.16, 1.5, 0.05), steel, 0, 0.55, 0); add(w, new T.BoxGeometry(0.4, 0.07, 0.09), trim, 0, -0.18, 0); }
    else if (key === 'minamo') { add(w, new T.CylinderGeometry(0.035, 0.035, 1.6, 6), dark, 0, 0.3, 0); add(w, new T.OctahedronGeometry(0.16, 0), trim, 0, 1.2, 0); }
    else if (key === 'touka') { add(w, new T.TorusGeometry(0.5, 0.035, 6, 14, Math.PI), dark, 0, 0.3, 0, 0, Math.PI / 2, -Math.PI / 2); add(w, new T.CylinderGeometry(0.012, 0.012, 1.0, 4), trim, 0, 0.3, 0); }
    else if (key === 'raiga') { add(w, new T.CylinderGeometry(0.035, 0.035, 1.9, 6), dark, 0, 0.35, 0); add(w, new T.ConeGeometry(0.1, 0.42, 6), trim, 0, 1.5, 0); }
    else { w.position.set(-0.4, 0.95, -0.25); add(w, new T.BoxGeometry(0.62, 0.86, 0.08), steel, 0, 0, 0); add(w, new T.OctahedronGeometry(0.15, 0), trim, 0, 0, -0.07); }
    const ring = new T.Mesh(new T.RingGeometry(0.55, 0.68, 40), new T.MeshBasicMaterial({ color: c, transparent: true, opacity: 0, side: T.DoubleSide }));
    ring.rotation.x = -Math.PI / 2; ring.position.y = 0.03; g.add(ring);
    g.userData = { ring, h: 1.9 };
    return g;
  }

  /* ---- 置き場所と状態 ---- */
  const ents = {};       // id -> { g, home, ... }
  let monKey = '', mode = 'idle', tweens = [], focusId = null, shake = 0, t0 = performance.now();
  const MON_POS = new T.Vector3(0, 0, 3.0);
  function clearEnts() { for (const k of Object.keys(ents)) { scene.remove(ents[k].g); delete ents[k]; } monKey = ''; }
  function ensure(state) {
    const m = state.units.find((u) => u.id === 'm');
    if (monKey === state.quest && ents.m) return;
    clearEnts(); monKey = state.quest;
    const mg = buildMonster(m.shape, m.el); mg.position.copy(MON_POS); mg.rotation.y = Math.PI; scene.add(mg);
    ents.m = { g: mg, home: MON_POS.clone(), baseRot: Math.PI, dead: false };
    const hs = state.units.filter((u) => u.side === 'h');
    hs.forEach((u, i) => {
      const a = (i - (hs.length - 1) / 2) * 0.36, r = 6.6;
      const g = buildHunter(u.key, u.el); const home = new T.Vector3(-Math.sin(a) * r, 0, MON_POS.z - Math.cos(a) * r);   // カメラは後ろから見るので、カードの並びと合わせて左右を逆に置く
      g.position.copy(home); g.lookAt(MON_POS.x, 0, MON_POS.z); scene.add(g);
      ents[u.id] = { g, home, baseRot: g.rotation.y, dead: false };
    });
  }
  function tween(ms, fn, done) { tweens.push({ t: 0, ms, fn, done }); }
  const ease = (x) => (x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2);

  const api = {
    setMode(m) { mode = m; if (m === 'idle' && !ents.m) api.previewQuest({ shape: 'wolf', el: 'red' }); },
    previewQuest(q) {
      if (mode === 'battle' || !q) return;
      const key = 'preview:' + q.shape + q.el; if (monKey === key) return;
      clearEnts(); monKey = key;
      const mg = buildMonster(q.shape, q.el); mg.position.set(0, 0, 0); scene.add(mg); ents.m = { g: mg, home: new T.Vector3(), baseRot: 0, dead: false, preview: true };
    },
    build(state) { ensure(state); },
    sync(state) {
      ensure(state);
      for (const u of state.units) {
        const e = ents[u.id]; if (!e) continue;
        const dead = u.hp <= 0;
        if (dead !== e.dead) { e.dead = dead; e.g.rotation.z = dead && u.side === 'h' ? Math.PI / 2 : 0; e.g.position.y = dead && u.side === 'h' ? 0.3 : 0; if (u.side === 'm') e.g.visible = !dead; }
        if (u.parts) for (const p of u.parts) e.g.userData.parts[p.id].visible = !p.broken;
        if (u.side === 'm') { e.g.userData.glow.emissiveIntensity = u.rage ? 1.8 : 0.9; e.charging = u.charging; }
      }
      api.focus(state.turn);
    },
    focus(id) { focusId = id; for (const k of Object.keys(ents)) { const r = ents[k].g.userData.ring; if (r) r.material.opacity = k === id ? 0.95 : 0; } },
    attack(uid, tid, type, burst) {
      const a = ents[uid], b = ents[tid]; if (!a) return;
      const from = a.home.clone();
      if ((type === 'phys' || uid === 'm') && b && b !== a) {
        const dir = b.home.clone().sub(a.home); const dist = dir.length(); dir.normalize();
        const to = a.home.clone().add(dir.multiplyScalar(Math.max(0.5, dist - (uid === 'm' ? 3.0 : 3.4))));
        tween(240, (x) => a.g.position.lerpVectors(from, to, ease(x)), () => tween(300, (x) => a.g.position.lerpVectors(to, from, ease(x))));
      } else {
        tween(380, (x) => { a.g.position.y = a.home.y + Math.sin(x * Math.PI) * (burst ? 0.9 : 0.45); }, () => { a.g.position.y = a.home.y; });
        if (b && b !== a && type !== 'heal' && type !== 'guard') bolt(a, b, burst);
      }
      if (burst) shake = Math.max(shake, 0.25);
    },
    hit(id, crit) {
      const e = ents[id]; if (!e) return; shake = Math.max(shake, id === 'm' ? (crit ? 0.22 : 0.1) : 0.16);
      const s0 = 1; tween(220, (x) => { const k = 1 + Math.sin(x * Math.PI) * (id === 'm' ? 0.06 : 0.14); e.g.scale.set(s0 * k, s0 / k, s0 * k); }, () => e.g.scale.set(1, 1, 1));
      api.glow(id, 0xffffff, 160);
    },
    glow(id, color, ms) {
      const e = ents[id]; if (!e) return;
      const l = new T.PointLight(color, 2.4, 7); l.position.copy(e.g.position).add(new T.Vector3(0, (e.g.userData.h || 2) * 0.6, 0)); scene.add(l);
      tween(ms || 420, (x) => { l.intensity = 2.4 * (1 - x); }, () => scene.remove(l));
    },
    ko(id) { const e = ents[id]; if (!e) return; e.dead = true; if (id === 'm') { tween(700, (x) => { e.g.rotation.z = x * 1.2; e.g.position.y = -x * 1.2; }, () => { e.g.visible = false; }); shake = 0.4; } else tween(380, (x) => { e.g.rotation.z = x * Math.PI / 2; e.g.position.y = x * 0.3; }); },
    revive(id) { const e = ents[id]; if (!e) return; e.dead = false; e.g.rotation.z = 0; e.g.position.y = 0; api.glow(id, 0x8df0a8, 600); },
    breakPart(pid) { const e = ents.m; if (!e) return; const p = e.g.userData.parts[pid]; if (p) { tween(360, (x) => { p.position.y = x * 1.6; p.rotation.x = x * 2; }, () => { p.visible = false; p.position.y = 0; p.rotation.x = 0; }); } shake = 0.35; api.glow('m', 0xf3e2b8, 600); },
    rage() { const e = ents.m; if (!e) return; e.g.userData.glow.emissiveIntensity = 1.8; shake = 0.35; api.glow('m', 0xff5a4a, 800); },
    charge() { const e = ents.m; if (!e) return; e.charging = true; api.glow('m', 0xff5a4a, 900); },
    screenPos(id) {
      const pid = /^p\d/.test(id) ? 'm' : id, e = ents[pid]; if (!e || mode !== 'battle') return null;
      const v = e.g.position.clone(); v.y += (e.g.userData.h || 2) * (pid === 'm' ? 0.75 : 1.05); v.project(cam);
      return { x: (v.x + 1) / 2 * innerWidth, y: (1 - v.y) / 2 * innerHeight };
    },
  };
  function bolt(a, b, burst) {
    const s = new T.Mesh(new T.SphereGeometry(burst ? 0.34 : 0.2, 10, 10), new T.MeshBasicMaterial({ color: a.g.children[1] ? 0xffffff : 0xffffff }));
    const from = a.g.position.clone().add(new T.Vector3(0, 1.4, 0)), to = b.home.clone().add(new T.Vector3(0, (b.g.userData.h || 2) * 0.6, 0));
    scene.add(s); const l = new T.PointLight(0xffffff, 1.6, 6); s.add(l);
    tween(300, (x) => { s.position.lerpVectors(from, to, x); s.position.y += Math.sin(x * Math.PI) * 0.8; }, () => scene.remove(s));
  }

  function resize() {
    const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); cam.aspect = w / h; cam.fov = w / h < 0.8 ? 62 : 42; cam.updateProjectionMatrix();
  }
  addEventListener('resize', resize); resize();
  const look = new T.Vector3(), want = new T.Vector3(); let camMode = '';
  function frame(now) {
    requestAnimationFrame(frame);
    if (document.hidden || (flat && mode === 'battle')) return;
    const dt = Math.min(50, now - t0); t0 = now; const tt = now / 1000;
    for (let i = tweens.length - 1; i >= 0; i--) { const tw = tweens[i]; tw.t += dt; const x = Math.min(1, tw.t / tw.ms); tw.fn(x); if (x >= 1) { tweens.splice(i, 1); if (tw.done) tw.done(); } }
    const m = ents.m;
    if (m && !m.dead) {
      if (m.preview) { m.g.rotation.y = tt * 0.35; m.g.position.y = Math.sin(tt * 1.3) * 0.06; }
      else { m.g.position.y += ((Math.sin(tt * 1.4) * 0.08) - (m.g.position.y - m.home.y)) * 0.08; if (m.charging) m.g.rotation.x = Math.sin(tt * 18) * 0.02; else m.g.rotation.x = 0; }
    }
    for (const k of Object.keys(ents)) { if (k === 'm') continue; const e = ents[k]; if (!e.dead) e.g.children[0].scale.y = 1 + Math.sin(tt * 2 + k.charCodeAt(1)) * 0.015; const r = e.g.userData.ring; if (r && r.material.opacity) r.rotation.z = tt; }
    dust.rotation.y = tt * 0.02;
    // カメラ
    const portrait = innerWidth / innerHeight < 0.8;
    if (mode === 'battle') { want.set(Math.sin(tt * 0.15) * 1.2, portrait ? 10.5 : 6.4, portrait ? -15.5 : -11.8); look.set(0, portrait ? 0.6 : 0.9, portrait ? -0.4 : 0.4); }
    else { want.set(Math.sin(tt * 0.2) * 1.5, 3.4, 9.5); look.set(0, 1.6, 0); }
    if (camMode !== mode) { camMode = mode; cam.position.copy(want); } else cam.position.lerp(want, 0.05);
    if (shake > 0.002) { cam.position.x += (Math.random() - 0.5) * shake; cam.position.y += (Math.random() - 0.5) * shake; shake *= 0.86; }
    cam.lookAt(look);
    renderer.render(scene, cam);
  }
  requestAnimationFrame(frame);
  return api;
})();

show('title');
connect();
</script>
