<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="robots" content="noindex">
<title>彩狩 -IROGARI-</title>
<style>
:root{
  --bg0:#080c1a; --bg1:#131a34; --panel:rgba(14,19,38,.84); --panel2:rgba(26,33,60,.92);
  --gold:#d9bf86; --gold2:#f6e7c1; --gold3:#8f7743; --line:rgba(217,191,134,.45); --ink:#f1eadb; --dim:#a9a595;
  --red:#ff6f61; --green:#6fd58a; --blue:#5cb2ff; --yellow:#f6d256; --purple:#bb90ff;
  --serif:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP","Times New Roman",serif;
  --sans:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
  --hex:polygon(16px 0,calc(100% - 16px) 0,100% 50%,calc(100% - 16px) 100%,16px 100%,0 50%);
  --cut:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(120% 90% at 50% 12%,#2a3768 0%,var(--bg1) 45%,var(--bg0) 100%);color:var(--ink);font-family:var(--sans);user-select:none;-webkit-user-select:none;touch-action:manipulation}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
.hidden{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}

/* ---- 枠（角を切った金ぶちの板） ---- */
.panel{position:relative;background:linear-gradient(160deg,rgba(246,231,193,.75),rgba(143,119,67,.5) 30%,rgba(217,191,134,.25) 60%,rgba(246,231,193,.6));clip-path:var(--cut);padding:1.5px;filter:drop-shadow(0 12px 26px rgba(0,0,0,.55))}
.panel>.in{position:relative;background:linear-gradient(180deg,rgba(24,31,58,.95),rgba(10,14,30,.96));clip-path:var(--cut);height:100%}
.panel>.in:before{content:"";position:absolute;inset:5px;border:1px solid rgba(217,191,134,.16);clip-path:var(--cut);pointer-events:none}
.orn{display:flex;align-items:center;gap:10px;color:var(--gold);font-size:11px;letter-spacing:.32em;font-family:var(--serif)}
.orn:before,.orn:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent)}

/* ---- ボタン（六角の刃の形・金ぶち・光が走る） ---- */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 30px;clip-path:var(--hex);background:linear-gradient(180deg,#f6e7c1,#8f7743 55%,#d9bf86);font-family:var(--serif);font-size:15px;letter-spacing:.16em;color:var(--ink);isolation:isolate;transition:transform .09s,filter .15s;overflow:hidden;white-space:nowrap}
.btn:before{content:"";position:absolute;inset:1.5px;clip-path:var(--hex);background:linear-gradient(180deg,#3a4576 0%,#1c2344 48%,#141a36 52%,#232c55 100%);z-index:-1}
.btn:after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);transition:left .5s;z-index:-1}
.btn:hover:after{left:120%}.btn:hover{filter:brightness(1.15)}.btn:active{transform:scale(.96)}
.btn.pri{color:#2b2410;font-weight:700;text-shadow:0 1px 0 rgba(255,255,255,.5)}
.btn.pri:before{background:linear-gradient(180deg,#fff6dc 0%,#ecd49a 45%,#c9a65f 55%,#e6cc90 100%)}
.btn.sm{min-height:36px;padding:0 20px;font-size:12px;--hex:polygon(11px 0,calc(100% - 11px) 0,100% 50%,calc(100% - 11px) 100%,11px 100%,0 50%)}
.btn:disabled{filter:grayscale(.8) brightness(.6);pointer-events:none}
.btn .gem{width:7px;height:7px;transform:rotate(45deg);background:currentColor;opacity:.75;margin:0 10px}
.field{position:relative;clip-path:var(--hex);background:linear-gradient(180deg,#8f7743,#4a4030);padding:1.5px}
.field input{width:100%;height:45px;clip-path:var(--hex);border:0;background:#0a0f22;color:var(--ink);padding:0 26px;font:inherit;font-size:16px;outline:none;text-align:center;letter-spacing:.08em}
.field:focus-within{background:linear-gradient(180deg,#f6e7c1,#d9bf86)}

.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom));overflow:auto}
.box .in{padding:24px 22px 20px}
.stack{display:grid;gap:10px;margin-top:12px}.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
.note{color:var(--dim);font-size:12px;line-height:1.7;margin-top:12px}

/* ---- タイトル ---- */
#title .box{width:min(450px,100%);text-align:center}
#title h1{margin:0;font-family:var(--serif);font-weight:500;font-size:52px;letter-spacing:.32em;text-indent:.32em;background:linear-gradient(180deg,#fffbe9,#d9bf86 65%,#9c7f48);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 16px rgba(217,191,134,.4))}
#title .sub{font-family:var(--serif);color:var(--gold);letter-spacing:.55em;text-indent:.55em;font-size:11px}
.dots{display:flex;justify-content:center;gap:10px;margin:12px 0 14px}.dot{width:10px;height:10px;transform:rotate(45deg);box-shadow:0 0 10px currentColor}
#acct{margin-top:6px}
#acctIn{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;background:rgba(8,12,26,.6);border:1px solid rgba(217,191,134,.25)}
#acctIn .who{font-family:var(--serif);font-size:17px;letter-spacing:.1em;text-align:left}
.stone{display:inline-flex;align-items:center;gap:6px;color:var(--gold2);font-family:var(--serif);font-size:15px}
.stone:before{content:"";width:11px;height:11px;transform:rotate(45deg);background:linear-gradient(135deg,#ff9a8e,#f6d256,#6fd58a,#5cb2ff,#bb90ff);box-shadow:0 0 8px rgba(255,255,255,.6)}
.tabs{display:flex;gap:6px;justify-content:center;margin:10px 0 2px}
.tab{font-family:var(--serif);font-size:12px;letter-spacing:.14em;color:var(--dim);padding:6px 14px;border-bottom:2px solid transparent}
.tab.on{color:var(--gold2);border-color:var(--gold)}
.rooms{display:grid;gap:6px;max-height:150px;overflow:auto;margin-top:10px}
.roomrow{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:rgba(8,12,26,.6);border:1px solid rgba(217,191,134,.22);font-size:13px;width:100%}
.roomrow:hover{border-color:var(--gold)}

/* ---- 部屋 ---- */
#lobby .box{width:min(780px,100%)}
#lobby h2{margin:0;font-family:var(--serif);font-weight:500;font-size:21px;letter-spacing:.2em}
.code{font-family:var(--serif);font-size:30px;letter-spacing:.35em;color:var(--gold2)}
.quests{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.quest{position:relative;padding:15px 8px 12px;clip-path:var(--cut);background:linear-gradient(180deg,color-mix(in srgb,var(--c) 26%,#141a36),#0d1228);text-align:center;transition:.15s;outline:1px solid rgba(255,255,255,.1);outline-offset:-1px}
.quest.on{outline:2px solid var(--gold2);filter:drop-shadow(0 0 14px rgba(217,191,134,.5));transform:translateY(-3px)}
.quest .nm{font-family:var(--serif);font-size:19px;letter-spacing:.14em}.quest .tt{color:var(--dim);font-size:11px;margin-top:3px}
.quest .st{color:var(--gold);font-size:13px;letter-spacing:.2em;margin-top:6px}
.quest .el{display:inline-block;margin-top:6px;padding:2px 10px;font-size:11px;border:1px solid var(--c);color:var(--c)}
.members{display:grid;gap:6px;margin:10px 0}
.member{display:flex;align-items:center;gap:10px;padding:9px 12px;background:rgba(8,12,26,.55);border-left:3px solid var(--gold3);font-size:14px}
.member .tag{margin-left:auto;font-size:11px;color:var(--gold)}.member.off{opacity:.45}
.share{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;font-size:11px;border:1px solid var(--c,var(--line));color:var(--c,var(--ink));background:rgba(8,12,26,.55)}

/* ---- 戦い ---- */
#hud{position:fixed;inset:0;pointer-events:none}#hud>*{pointer-events:auto}
#order{position:absolute;left:max(10px,env(safe-area-inset-left));top:max(10px,env(safe-area-inset-top));display:flex;flex-direction:column;gap:5px;width:74px}
#order .lbl{font-family:var(--serif);font-size:10px;letter-spacing:.24em;color:var(--gold);text-align:center;text-shadow:0 1px 4px #000}
.ord{position:relative;height:28px;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%);background:linear-gradient(90deg,var(--c),color-mix(in srgb,var(--c) 30%,#0b1020));display:flex;align-items:center;justify-content:center;font-size:11px;font-family:var(--serif);color:#fff;text-shadow:0 1px 3px #000;white-space:nowrap;transition:.25s;opacity:.82}
.ord.now{height:38px;font-size:13px;opacity:1;filter:drop-shadow(0 0 8px var(--c));margin-right:-10px}
.ord.foe{background:linear-gradient(90deg,#3a0d0d,var(--c))}

#boss{position:absolute;top:max(10px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:min(540px,calc(100% - 200px))}
#boss .in{padding:9px 16px 10px;text-align:center}
#boss .nm{font-family:var(--serif);font-size:20px;letter-spacing:.24em;text-indent:.24em}
#boss .meta{display:flex;justify-content:center;gap:5px;margin:3px 0 6px;flex-wrap:wrap;min-height:20px}
.bar{position:relative;height:11px;background:#05070f;outline:1px solid rgba(217,191,134,.35);transform:skewX(-18deg);overflow:hidden}
.bar>i{position:absolute;inset:0 auto 0 0;width:100%;background:linear-gradient(180deg,#ffb199,#ff6f61 55%,#c43b33);transition:width .3s cubic-bezier(.2,.8,.2,1)}
.bar>b{position:absolute;inset:0 auto 0 0;width:100%;background:#fff;opacity:.6;transition:width .8s .25s}
#boss .hpn{font-size:11px;color:var(--dim);margin-top:3px}
#parts{display:flex;gap:6px;margin-top:8px}
.part{flex:1;position:relative;padding:6px 6px 7px;clip-path:polygon(7px 0,100% 0,calc(100% - 7px) 100%,0 100%);background:#1a2142;font-size:11px;color:var(--ink);transition:.15s}
.part .bar{height:4px;margin:4px 6px 0;outline:0}.part .bar>i{background:linear-gradient(90deg,#9fd0ff,#eef7ff)}
.part.sel{background:linear-gradient(180deg,#f6e7c1,#c9a65f);color:#2b2410;font-weight:700;filter:drop-shadow(0 0 8px rgba(246,231,193,.7))}
.part.broken{opacity:.35;text-decoration:line-through;pointer-events:none}
#warn{position:absolute;top:calc(max(10px,env(safe-area-inset-top)) + 150px);left:50%;transform:translateX(-50%);padding:7px 26px;clip-path:var(--hex);background:linear-gradient(90deg,#5a0c0c,#b3261e,#5a0c0c);color:#ffe4dd;font-size:13px;font-family:var(--serif);letter-spacing:.1em;white-space:nowrap;max-width:94vw;animation:warn .5s infinite alternate}
@keyframes warn{to{filter:brightness(1.5)}}
#log{opacity:0;position:absolute;left:38%;transform:translateX(-50%);bottom:calc(max(10px,env(safe-area-inset-bottom)) + 112px);padding:5px 22px;background:linear-gradient(90deg,transparent,rgba(5,8,18,.85) 18%,rgba(5,8,18,.85) 82%,transparent);font-size:12px;white-space:nowrap;max-width:96vw;overflow:hidden;text-overflow:ellipsis;transition:opacity .3s}

#party{position:absolute;left:50%;transform:translateX(-50%);bottom:max(8px,env(safe-area-inset-bottom));display:flex;gap:6px;width:min(840px,calc(100% - 12px))}
.card{flex:1;min-width:0;position:relative;clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);background:linear-gradient(180deg,var(--c),color-mix(in srgb,var(--c) 25%,#0b1020));padding:1.5px;transition:transform .2s,filter .2s}
.card>.in{clip-path:inherit;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 20%,#161d3c),#0b1024);padding:8px 8px 7px;height:100%}
.card .nm{font-family:var(--serif);font-size:14px;letter-spacing:.08em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .rl{font-size:9px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .bar{height:8px;margin:5px 3px 0}.card .bar>i{background:linear-gradient(180deg,#c4f7b1,#57d38a 60%,#2f9a5e)}
.card.low .bar>i{background:linear-gradient(180deg,#ffc1a3,#ff7a6b 60%,#c43b33)}
.card .hpn{font-size:10px;color:var(--dim);margin-top:2px;text-align:right}
.card .bst{height:3px;margin:3px 3px 0;background:rgba(255,255,255,.1);transform:skewX(-18deg);overflow:hidden}.card .bst>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--c),#fff);transition:width .3s}
.card.full .bst{box-shadow:0 0 8px var(--c)}
.card .sts{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px;min-height:15px}
.card .own{position:absolute;right:8px;top:5px;font-size:9px;padding:0 6px;color:var(--gold2);background:rgba(8,12,26,.7);max-width:46%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card.now{transform:translateY(-8px);filter:drop-shadow(0 0 12px var(--c))}
.card.ko{filter:grayscale(1) brightness(.55)}
.card.pick{animation:pick .6s infinite alternate;cursor:pointer}@keyframes pick{to{filter:drop-shadow(0 0 14px #f6e7c1) brightness(1.25)}}
.stc{font-size:9px;padding:0 5px;white-space:nowrap;border-left:2px solid}
.stc.buff{color:#b7f0c6;border-color:#6fd58a;background:rgba(30,80,50,.55)}.stc.debuff{color:#ffc2ba;border-color:#ff6f61;background:rgba(90,30,26,.55)}

/* 技のボタン（紋章の形） */
#skills{position:absolute;right:max(12px,env(safe-area-inset-right));bottom:calc(max(8px,env(safe-area-inset-bottom)) + 122px);display:flex;align-items:flex-end;gap:12px}
.sk{position:relative;width:74px;display:flex;flex-direction:column;align-items:center;gap:3px;transition:transform .12s}
.sk .em{position:relative;width:64px;height:64px;transform:rotate(45deg);background:linear-gradient(135deg,#f6e7c1,#8f7743 50%,#d9bf86);padding:2px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.6))}
.sk .em i{position:absolute;inset:2px;background:radial-gradient(circle at 30% 30%,color-mix(in srgb,var(--k) 55%,#fff),var(--k) 38%,#0d1228 92%)}
.sk .em b{position:absolute;inset:7px;border:1px solid rgba(255,255,255,.35)}
.sk svg{position:absolute;left:50%;top:32px;width:34px;height:34px;transform:translate(-50%,-50%);fill:#fff;filter:drop-shadow(0 1px 3px rgba(0,0,0,.7));pointer-events:none}
.sk .kd{font-size:9px;letter-spacing:.12em;color:var(--gold);margin-top:14px;text-shadow:0 1px 3px #000;font-family:var(--serif)}
.sk .nm{font-size:11px;font-family:var(--serif);text-shadow:0 1px 4px #000,0 0 6px #000;white-space:nowrap}
.sk.sel{transform:translateY(-10px) scale(1.08)}.sk.sel .em{filter:drop-shadow(0 0 14px #f6e7c1) brightness(1.25)}
.sk.off .em{filter:grayscale(1) brightness(.5)}.sk.off .nm{color:var(--dim)}
.sk .cdn{position:absolute;left:50%;top:32px;transform:translate(-50%,-50%);font-family:var(--serif);font-size:26px;color:#fff;text-shadow:0 0 8px #000,0 2px 0 #000}
.sk.ult{width:88px}.sk.ult .em{width:76px;height:76px}.sk.ult svg,.sk.ult .cdn{top:38px}.sk.ult svg{width:40px;height:40px}
.sk.ult .em i{background:linear-gradient(315deg,var(--c) calc(var(--p)*1%),#232c55 calc(var(--p)*1%))}
.sk.ult.off .em{filter:brightness(.8)}
.sk.ult.ready .em{animation:rdy .8s infinite alternate}.sk.ult.ready .em i{background:radial-gradient(circle at 30% 30%,#fff,var(--c) 45%,#0d1228)}
@keyframes rdy{to{filter:drop-shadow(0 0 20px var(--c)) brightness(1.3)}}
#passive{position:absolute;right:max(12px,env(safe-area-inset-right));bottom:calc(max(8px,env(safe-area-inset-bottom)) + 256px);display:flex;gap:6px}
.pv{font-size:10px;font-family:var(--serif);padding:3px 12px;clip-path:polygon(7px 0,100% 0,calc(100% - 7px) 100%,0 100%);background:rgba(10,14,30,.85);color:var(--gold2);letter-spacing:.06em}
.pv small{color:var(--dim);margin-right:5px;font-size:9px}
#desc{position:absolute;right:max(12px,env(safe-area-inset-right));bottom:calc(max(8px,env(safe-area-inset-bottom)) + 288px);width:min(340px,calc(100% - 24px))}
#desc .in{padding:11px 15px}
#desc .nm{font-family:var(--serif);font-size:16px;letter-spacing:.12em;color:var(--gold2)}
#desc .tx{font-size:12px;line-height:1.65;margin:4px 0 8px}#desc .how{font-size:11px;color:var(--gold)}
#clock{position:absolute;right:max(10px,env(safe-area-inset-right));top:max(10px,env(safe-area-inset-top));display:flex;gap:6px;align-items:center}
#time{min-width:58px;height:36px;clip-path:var(--hex);background:#0a0f22;outline:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:17px}
#time.hot{color:#ff9a8c;background:#3a0d0d}
#whose{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(max(8px,env(safe-area-inset-bottom)) + 104px);font-family:var(--serif);font-size:12px;letter-spacing:.14em;color:var(--gold2);text-shadow:0 2px 8px #000;white-space:nowrap}

/* ---- 演出の重ね ---- */
#tband{position:fixed;left:0;right:0;top:34%;height:64px;pointer-events:none;z-index:20;opacity:0;display:flex;align-items:center;justify-content:center;transform:skewY(-4deg)}
#tband:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--c) 85%,#000) 20%,color-mix(in srgb,var(--c) 85%,#000) 80%,transparent);clip-path:polygon(0 18%,100% 0,100% 82%,0 100%)}
#tband:after{content:"";position:absolute;left:0;right:0;top:6px;bottom:6px;border-top:2px solid rgba(255,255,255,.8);border-bottom:2px solid rgba(255,255,255,.8);clip-path:polygon(8% 0,92% 0,92% 100%,8% 100%)}
#tband span{position:relative;font-family:var(--serif);font-weight:700;font-size:34px;letter-spacing:.2em;color:#fff;text-shadow:0 0 14px var(--c),0 3px 0 rgba(0,0,0,.6);font-style:italic;white-space:nowrap}
#tband.go{animation:tband .78s cubic-bezier(.15,.85,.25,1) forwards}
@keyframes tband{0%{opacity:0;transform:skewY(-4deg) translateX(-110%)}22%{opacity:1;transform:skewY(-4deg) translateX(0)}74%{opacity:1;transform:skewY(-4deg) translateX(2%)}100%{opacity:0;transform:skewY(-4deg) translateX(110%)}}
#banner{position:fixed;top:25%;left:50%;transform:translate(-50%,-50%);font-family:var(--serif);font-size:30px;letter-spacing:.3em;text-indent:.3em;color:#fff;text-shadow:0 0 18px var(--c,#fff),0 0 4px var(--c,#fff),0 2px 6px #000;opacity:0;white-space:nowrap;pointer-events:none;z-index:21}
#banner small{display:block;font-size:11px;letter-spacing:.5em;color:var(--gold2);text-indent:.5em;text-align:center}
#banner.show{animation:ban .95s ease-out forwards}
@keyframes ban{0%{opacity:0;transform:translate(-50%,-30%) scale(1.5)}16%{opacity:1;transform:translate(-50%,-50%) scale(1)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-62%)}}
#cut{position:fixed;inset:0;pointer-events:none;z-index:19;opacity:0;background:linear-gradient(180deg,#000 0,#000 16%,transparent 16%,transparent 84%,#000 84%)}
#cut.go{animation:cut 1.25s ease-out forwards}@keyframes cut{0%{opacity:0}12%{opacity:1}80%{opacity:1}100%{opacity:0}}
#cut span{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%) skewX(-12deg);text-align:center;font-family:var(--serif);font-weight:700;font-size:54px;letter-spacing:.24em;color:#fff;text-shadow:0 0 30px var(--c),0 0 8px var(--c),4px 4px 0 rgba(0,0,0,.7);animation:none}
#cut.go span{animation:cutT 1.25s cubic-bezier(.1,.9,.2,1) forwards}@keyframes cutT{0%{transform:translate(60%,-50%) skewX(-12deg);opacity:0}18%{transform:translate(0,-50%) skewX(-12deg);opacity:1}80%{transform:translate(-3%,-50%) skewX(-12deg);opacity:1}100%{transform:translate(-60%,-50%) skewX(-12deg);opacity:0}}
#flash{position:fixed;inset:0;pointer-events:none;z-index:18;opacity:0;background:#fff}
.float{position:fixed;left:0;top:0;font-family:var(--serif);font-weight:900;font-size:30px;color:#fff;-webkit-text-stroke:1px rgba(0,0,0,.55);text-shadow:0 3px 0 rgba(0,0,0,.6),0 0 10px rgba(0,0,0,.8);pointer-events:none;white-space:nowrap;animation:fl 1.05s ease-out forwards;z-index:30;font-style:italic}
.float.crit{font-size:50px;background:linear-gradient(180deg,#fff,#ffe27a 45%,#ff8a3c);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:1.5px #6b2a00;filter:drop-shadow(0 0 12px #ffb347);animation:flc 1.2s cubic-bezier(.2,1.6,.3,1) forwards}
.float.crit:before{content:"会心!!";display:block;font-size:17px;letter-spacing:.2em;text-align:center;-webkit-text-stroke:0;color:#fff3c4;background:none;-webkit-background-clip:initial}
.float.heal{color:#9bf5b3;-webkit-text-stroke:1px #0d4a22}.float.adv{color:#ffc26b}.float.dis{color:#a7b9cf;font-size:22px}.float.psn{color:#d0a8ff;-webkit-text-stroke:1px #3a0d66}
.float.txt{font-size:17px;font-weight:700;color:#ffe9c4;font-style:normal;letter-spacing:.1em}
.float.bad{font-size:19px;color:#ffb4a8;-webkit-text-stroke:1px #5a0c0c;font-style:normal}.float.good{font-size:19px;color:#c5f7d0;-webkit-text-stroke:1px #0d4a22;font-style:normal}
@keyframes fl{0%{opacity:0;transform:translate(-50%,-10%) scale(.5)}14%{opacity:1;transform:translate(-50%,-60%) scale(1.25)}28%{transform:translate(-50%,-80%) scale(1)}100%{opacity:0;transform:translate(-50%,-210%)}}
@keyframes flc{0%{opacity:0;transform:translate(-50%,-30%) scale(2.6) rotate(-8deg)}16%{opacity:1;transform:translate(-50%,-70%) scale(1) rotate(-4deg)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-160%) scale(1.05) rotate(-4deg)}}

#result .box,#achv .box,#menu .box{width:min(440px,100%);text-align:center}
#result h2{margin:10px 0 0;font-family:var(--serif);font-weight:500;font-size:42px;letter-spacing:.3em;text-indent:.3em}
#result.win h2{background:linear-gradient(180deg,#fffbe9,#d9bf86);-webkit-background-clip:text;background-clip:text;color:transparent}#result.lose h2{color:#9aa3c0}
#gain{margin-top:10px;font-size:13px;line-height:1.9}
.ach{display:flex;align-items:center;gap:10px;padding:9px 12px;background:rgba(8,12,26,.6);border-left:3px solid var(--gold3);text-align:left}
.ach.ready{border-color:var(--gold2);background:rgba(60,50,20,.5)}.ach.claimed{opacity:.5}
.ach .an{font-family:var(--serif);font-size:14px}.ach .ad{font-size:11px;color:var(--dim)}.ach .ar{margin-left:auto;display:flex;align-items:center;gap:8px;white-space:nowrap}
#achList{display:grid;gap:6px;max-height:52vh;overflow:auto;margin-top:12px}
#toast{position:fixed;left:50%;top:14%;transform:translateX(-50%);padding:9px 26px;clip-path:var(--hex);background:#0a0f22;outline:1px solid var(--line);font-size:13px;z-index:60;opacity:0;transition:opacity .25s;pointer-events:none;max-width:94vw;text-align:center}
#toast.show{opacity:1}
.over{position:fixed;inset:0;background:rgba(4,6,14,.62);z-index:40;display:flex;align-items:center;justify-content:center;padding:14px;overflow:auto}

@media (max-width:700px){
  #order{flex-direction:row;width:auto;right:150px;left:6px;top:max(6px,env(safe-area-inset-top));gap:2px}
  #order .lbl{display:none}.ord{flex:1;min-width:0;height:26px;font-size:9px}.ord.now{height:26px;flex:1.6;margin:0}
  #boss{top:calc(max(6px,env(safe-area-inset-top)) + 34px);width:calc(100% - 12px)}#boss .nm{font-size:16px}#boss .in{padding:7px 10px 8px}
  #clock{top:max(4px,env(safe-area-inset-top));right:4px;gap:3px}#time{min-width:46px;height:30px;font-size:14px}#clock .btn{min-height:30px;padding:0 14px}
  #warn{top:auto;bottom:calc(max(8px,env(safe-area-inset-bottom)) + 300px);font-size:11px}
  #party{gap:3px;width:calc(100% - 6px)}.card>.in{padding:6px 4px 5px}.card .nm{font-size:11px}.card .rl,.card .own{display:none}.card .hpn{font-size:8px}.stc{font-size:8px;padding:0 3px}
  #skills{right:50%;transform:translateX(50%);bottom:calc(max(8px,env(safe-area-inset-bottom)) + 96px);gap:6px}
  .sk{width:70px}.sk .em{width:54px;height:54px}.sk svg,.sk .cdn{top:27px}.sk svg{width:28px;height:28px}.sk .nm{font-size:10px}.sk .kd{margin-top:11px;font-size:8px}
  .sk.ult{width:78px}.sk.ult .em{width:62px;height:62px}.sk.ult svg,.sk.ult .cdn{top:31px}
  #passive{right:50%;transform:translateX(50%);bottom:calc(max(8px,env(safe-area-inset-bottom)) + 214px)}
  #desc{right:50%;transform:translateX(50%);bottom:calc(max(8px,env(safe-area-inset-bottom)) + 240px)}#desc .in{padding:7px 12px}#desc .nm{font-size:13px}#desc .tx{font-size:11px;margin:2px 0 3px;line-height:1.45}#desc .how{font-size:10px}
  #whose{bottom:calc(max(8px,env(safe-area-inset-bottom)) + 80px);font-size:10px}
  #log{bottom:calc(max(8px,env(safe-area-inset-bottom)) + 330px);font-size:10px}
  #tband{height:50px}#tband span{font-size:22px}#banner{font-size:22px}#cut span{font-size:32px}
  #title h1{font-size:42px}.quests{gap:6px}.quest .nm{font-size:15px}.box .in{padding:20px 16px 16px}
}
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div id="title" class="screen">
  <div class="box panel"><div class="in">
    <div class="sub">FIVE COLORS HUNT</div>
    <h1>彩狩</h1>
    <div class="dots"><i class="dot" style="background:var(--red);color:var(--red)"></i><i class="dot" style="background:var(--green);color:var(--green)"></i><i class="dot" style="background:var(--blue);color:var(--blue)"></i><i class="dot" style="background:var(--yellow);color:var(--yellow)"></i><i class="dot" style="background:var(--purple);color:var(--purple)"></i></div>
    <div id="acct">
      <div id="acctIn" class="hidden"><div><div class="who" id="who"></div><span class="stone" id="stones">0</span></div><div style="display:flex;gap:6px"><button id="bAch" class="btn sm">実績</button><button id="bOut" class="btn sm">ログアウト</button></div></div>
      <div id="acctOut">
        <div class="tabs"><button class="tab on" id="tGuest">ゲストで遊ぶ</button><button class="tab" id="tLogin">ログイン</button><button class="tab" id="tReg">新規登録</button></div>
        <div class="stack" id="fGuest" style="margin-top:6px"><div class="field"><input id="name" maxlength="12" placeholder="なまえ（12文字まで）" autocomplete="off"></div></div>
        <div class="stack hidden" id="fAuth" style="margin-top:6px">
          <div class="field"><input id="user" maxlength="12" placeholder="ユーザー名（3〜12文字）" autocomplete="username"></div>
          <div class="field"><input id="pass" type="password" maxlength="64" placeholder="パスワード（6文字以上）" autocomplete="current-password"></div>
          <button id="bAuth" class="btn pri">ログイン</button>
          <div class="note" style="margin:0" id="authNote">ログインすると、戦績・実績・報酬（彩石）が残ります。</div>
        </div>
      </div>
    </div>
    <div class="orn" style="margin-top:14px">◆ 狩りへ ◆</div>
    <div class="stack">
      <button id="bSolo" class="btn pri"><i class="gem"></i>ひとりで狩る<i class="gem"></i></button>
      <div class="row"><button id="bQuick" class="btn">すぐ入る</button><button id="bMake" class="btn">部屋を作る</button></div>
      <div class="row"><div class="field"><input id="code" inputmode="numeric" maxlength="4" placeholder="合言葉"></div><button id="bJoin" class="btn" style="flex:.7">入る</button></div>
    </div>
    <div id="roomList" class="rooms"></div>
  </div></div>
</div>

<div id="lobby" class="screen hidden">
  <div class="box panel"><div class="in">
    <div class="orn">◆ 狩りの準備 ◆</div>
    <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:8px">
      <div><h2>依頼をえらぶ</h2><div class="note" style="margin:0" id="lobbyHint"></div></div>
      <div style="text-align:right"><div class="note" style="margin:0">合言葉</div><div class="code" id="roomCode">----</div></div>
    </div>
    <div class="quests" id="quests"></div>
    <div class="orn">◆ なかま ◆</div>
    <div class="members" id="members"></div>
    <div class="row" style="margin-top:12px"><button id="bLeave" class="btn" style="flex:.6">戻る</button><button id="bStart" class="btn pri">狩りに出る</button></div>
  </div></div>
</div>

<div id="hud" class="hidden">
  <div id="order"></div>
  <div id="boss" class="panel"><div class="in">
    <div class="nm" id="bossName"></div><div class="meta" id="bossMeta"></div>
    <div class="bar"><b id="bossHpB"></b><i id="bossHp"></i></div><div class="hpn" id="bossHpN"></div>
    <div id="parts"></div>
  </div></div>
  <div id="clock"><div id="time">--</div><button id="bMenu" class="btn sm">MENU</button></div>
  <div id="warn" class="hidden"></div>
  <div id="log"></div><div id="whose"></div>
  <div id="desc" class="panel hidden"><div class="in"><div class="nm" id="descName"></div><div class="tx" id="descText"></div><div class="how" id="descHow"></div></div></div>
  <div id="passive"></div>
  <div id="skills"></div>
  <div id="party"></div>
</div>
<div id="cut"><span></span></div><div id="tband"><span></span></div><div id="banner"></div><div id="flash"></div>

<div id="result" class="over hidden" style="z-index:35">
  <div class="box panel"><div class="in">
    <div class="orn">◆ 狩りの結果 ◆</div><h2 id="resTitle"></h2><div class="note" id="resText"></div><div id="gain"></div>
    <div class="stack"><button id="bAgain" class="btn pri">部屋に戻る</button><button id="bQuit" class="btn">タイトルへ</button></div>
  </div></div>
</div>
<div id="achv" class="over hidden"><div class="box panel"><div class="in">
  <div class="orn">◆ 実績と報酬 ◆</div><div style="margin-top:8px"><span class="stone" id="stones2">0</span></div>
  <div id="achList"></div><div class="stack"><button id="bAchClose" class="btn pri">とじる</button></div>
</div></div></div>
<div id="menu" class="over hidden"><div class="box panel"><div class="in">
  <div class="orn">◆ メニュー ◆</div><div class="stack"><button id="mQuit" class="btn">狩りをやめる</button><button id="mClose" class="btn pri">とじる</button></div>
</div></div></div>
<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
/* =====================================================================
   彩狩 -IROGARI-  クライアント
   戦いの計算はサーバー。ここは「見せる」と「選んだ技を送る」だけ。
   ===================================================================== */
const $ = (id) => document.getElementById(id);
const EL = { red: '#ff6f61', green: '#6fd58a', blue: '#5cb2ff', yellow: '#f6d256', purple: '#bb90ff' };
const TYPE = { phys: '物理', spec: '特殊', guard: '防御', heal: '回復', debuff: '妨害' };
const TYPE_C = { phys: '#c8553f', spec: '#3f79c8', guard: '#4a8f86', heal: '#3f9a5c', debuff: '#7a4fc0' };
const ICON = {
  phys: '<svg viewBox="0 0 24 24"><path d="M19.5 2 21 3.5 9.6 14.9l1.5 1.5-1.4 1.4-1.6-1.6-3 3L3.7 17.8l3-3-1.6-1.6 1.4-1.4 1.5 1.5z"/></svg>',
  spec: '<svg viewBox="0 0 24 24"><path d="M12 1l2.4 7.2L22 11l-7.6 2.6L12 23l-2.4-9.4L2 11l7.6-2.8z"/></svg>',
  guard: '<svg viewBox="0 0 24 24"><path d="M12 2l8 3v6c0 5-3.4 9.3-8 11-4.6-1.7-8-6-8-11V5z"/></svg>',
  heal: '<svg viewBox="0 0 24 24"><path d="M9 3h6v6h6v6h-6v6H9v-6H3V9h6z"/></svg>',
  debuff: '<svg viewBox="0 0 24 24"><path d="M12 2a8 8 0 0 0-5 14.2V19h3v2h4v-2h3v-2.8A8 8 0 0 0 12 2zM9 9a1.6 1.6 0 1 1 0 3.2A1.6 1.6 0 0 1 9 9zm6 0a1.6 1.6 0 1 1 0 3.2A1.6 1.6 0 0 1 15 9z"/></svg>',
};
const ST_COL = { atkUp: 0xff9a4a, atkDown: 0x8a6bff, slow: 0x5cb2ff, stop: 0xdfe8ff, poison: 0xb06bff, defDown: 0xff6f61, immune: 0xf6e7c1, guard: 0x8fd0ff, taunt: 0xff5a8a, stopResist: 0x999999 };
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} } };

let ws = null, me = null, defs = null, room = null, st = null, timeOff = 0, acct = null, lastReward = null;
let sel = { si: -1, part: 'm', pv: null };
let queue = [], playing = false, disp = {}, showTurn = null;

/* ---------------- 通信 ---------------- */
function connect() {
  const base = location.pathname.endsWith('/') ? location.pathname : location.pathname.replace(/[^/]*$/, '');
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + base + 'ws');
  ws.onopen = () => send({ t: 'hello', token: store.get('hunt_token'), name: $('name').value || store.get('hunt_name') || '', session: store.get('hunt_session') || undefined });
  ws.onmessage = (e) => { let m; try { m = JSON.parse(e.data); } catch (x) { return; } onMsg(m); };
  ws.onclose = () => { toast('接続が切れました。つなぎ直しています…'); setTimeout(connect, 1500); };
}
function send(o) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); }
setInterval(() => send({ t: 'ping' }), 25000);

function onMsg(m) {
  switch (m.t) {
    case 'welcome':
      me = m.id; defs = m.defs; store.set('hunt_token', m.token);
      if (m.badSession) store.set('hunt_session', null);
      if (!$('name').value) $('name').value = store.get('hunt_name') || '';
      setAcct(m.me);
      if (!room) send({ t: 'rooms' });
      break;
    case 'auth':
      $('bAuth').disabled = false;
      if (m.error) { toast(m.error); break; }
      store.set('hunt_session', m.session || null); setAcct(m.me); $('pass').value = '';
      toast(m.me ? (m.created ? `ようこそ、${m.me.name} さん！` : `おかえりなさい、${m.me.name} さん`) : 'ログアウトしました');
      break;
    case 'me': setAcct(m.me); break;
    case 'reward': lastReward = m; drawGain(); break;
    case 'claimed': toast(`彩石 ${m.reward} を受け取りました`); break;
    case 'rooms': drawRoomList(m.rooms); break;
    case 'room':
      room = m; drawLobby();
      if (m.phase === 'lobby') { st = null; queue = []; disp = {}; lastReward = null; show('lobby'); }
      break;
    case 'state':
      timeOff = m.now - Date.now(); st = m.state;
      if ($('hud').classList.contains('hidden')) { show('hud'); disp = {}; }
      if (!Object.keys(disp).length) { syncDisp(); if (m.events.length) rewindDisp(m.events); }
      scene3d.build(st);
      for (const e of m.events) queue.push(e);
      queue.push({ t: '_sync', state: m.state });
      pump();
      break;
    case 'left': room = null; st = null; queue = []; show('title'); send({ t: 'rooms' }); break;
    case 'error': case 'notice': toast(m.msg); break;
  }
}

/* ---------------- アカウント ---------------- */
function setAcct(a) {
  acct = a || null;
  $('acctIn').classList.toggle('hidden', !acct); $('acctOut').classList.toggle('hidden', !!acct);
  if (acct) { $('who').textContent = acct.name; $('stones').textContent = acct.stones.toLocaleString(); $('stones2').textContent = acct.stones.toLocaleString() + ' 彩石'; const n = acct.achievements.filter((x) => x.state === 'ready').length; $('bAch').textContent = n ? `実績（${n}）` : '実績'; drawAch(); }
}
let authMode = 'guest';
function setTab(m) {
  authMode = m; for (const [id, k] of [['tGuest', 'guest'], ['tLogin', 'login'], ['tReg', 'register']]) $(id).classList.toggle('on', k === m);
  $('fGuest').classList.toggle('hidden', m !== 'guest'); $('fAuth').classList.toggle('hidden', m === 'guest');
  $('bAuth').textContent = m === 'register' ? 'この内容で登録する' : 'ログイン';
  $('pass').autocomplete = m === 'register' ? 'new-password' : 'current-password';
  $('authNote').textContent = m === 'register' ? 'パスワードは忘れると元に戻せません。ほかのサービスと同じものは使わないでください。' : 'ログインすると、戦績・実績・報酬（彩石）が残ります。';
}
$('tGuest').onclick = () => setTab('guest'); $('tLogin').onclick = () => setTab('login'); $('tReg').onclick = () => setTab('register');
$('bAuth').onclick = () => { const u = $('user').value.trim(), p = $('pass').value; if (!u || !p) return toast('ユーザー名とパスワードを入力してください'); $('bAuth').disabled = true; send({ t: authMode === 'register' ? 'register' : 'login', user: u, pass: p }); setTimeout(() => { $('bAuth').disabled = false; }, 6000); };
$('pass').onkeydown = (e) => { if (e.key === 'Enter') $('bAuth').click(); };
$('bOut').onclick = () => send({ t: 'logout' });
$('bAch').onclick = () => { send({ t: 'me' }); $('achv').classList.remove('hidden'); };
$('bAchClose').onclick = () => $('achv').classList.add('hidden');
function drawAch() {
  const box = $('achList'); box.innerHTML = ''; if (!acct) return;
  for (const a of acct.achievements) {
    const d = document.createElement('div'); d.className = 'ach ' + a.state;
    d.innerHTML = `<div><div class="an"></div><div class="ad"></div></div><div class="ar"><span class="stone"></span></div>`;
    d.querySelector('.an').textContent = a.name; d.querySelector('.ad').textContent = a.desc; d.querySelector('.stone').textContent = a.reward;
    const r = d.querySelector('.ar');
    if (a.state === 'ready') { const b = document.createElement('button'); b.className = 'btn sm pri'; b.textContent = '受け取る'; b.onclick = () => send({ t: 'claim', id: a.id }); r.appendChild(b); }
    else { const s = document.createElement('span'); s.style.cssText = 'font-size:11px;color:var(--dim)'; s.textContent = a.state === 'claimed' ? '受け取り済み' : '未達成'; r.appendChild(s); }
    box.appendChild(d);
  }
}

/* ---------------- 画面の切り替え ---------------- */
function show(id) {
  for (const k of ['title', 'lobby', 'hud']) $(k).classList.toggle('hidden', k !== id);
  if (id !== 'hud') $('result').classList.add('hidden');
  scene3d.setMode(id === 'hud' ? 'battle' : 'idle');
}
let toastT = 0;
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2800); }
const sendName = () => { if (acct) return; const n = $('name').value.trim(); store.set('hunt_name', n); send({ t: 'name', name: n }); };
$('bSolo').onclick = () => { sendName(); send({ t: 'create', quest: 'hibashiri', public: false }); };
$('bMake').onclick = () => { sendName(); send({ t: 'create', quest: 'hibashiri', public: true }); };
$('bQuick').onclick = () => { sendName(); send({ t: 'quick' }); };
$('bJoin').onclick = () => { sendName(); send({ t: 'join', code: $('code').value.trim() }); };
$('bLeave').onclick = () => send({ t: 'leave' });
$('bStart').onclick = () => send({ t: 'start' });
$('bAgain').onclick = () => { if (room && room.host === me) send({ t: 'again' }); else toast('部屋を作った人が戻すのを待っています'); };
$('bQuit').onclick = $('mQuit').onclick = () => { $('menu').classList.add('hidden'); send({ t: 'leave' }); };
$('bMenu').onclick = () => $('menu').classList.remove('hidden');
$('mClose').onclick = () => $('menu').classList.add('hidden');

function drawRoomList(list) {
  const box = $('roomList'); box.innerHTML = '';
  if (!list.length || !defs) return;
  const h = document.createElement('div'); h.className = 'orn'; h.textContent = '◆ 募集中の部屋 ◆'; box.appendChild(h);
  for (const r of list) {
    const q = defs.quests[r.quest], b = document.createElement('button'); b.className = 'roomrow';
    b.innerHTML = `<span></span><span style="color:var(--dim);font-size:11px"></span>`;
    b.children[0].textContent = `${q.name}　${r.host}`; b.children[1].textContent = `${r.n} / 5人`;
    b.onclick = () => { sendName(); send({ t: 'join', code: r.code }); };
    box.appendChild(b);
  }
}
function drawLobby() {
  if (!room || !defs) return;
  const host = room.host === me;
  $('roomCode').textContent = room.code;
  $('lobbyHint').textContent = host ? (room.public ? 'だれでも入れる部屋です' : '合言葉を知っている人だけ入れます') : '部屋を作った人が依頼をえらびます';
  const qs = $('quests'); qs.innerHTML = '';
  for (const k of Object.keys(defs.quests)) {
    const q = defs.quests[k], b = document.createElement('button'); b.className = 'quest' + (room.quest === k ? ' on' : ''); b.style.setProperty('--c', EL[q.el]);
    b.innerHTML = `<div class="nm"></div><div class="tt"></div><div class="st"></div><span class="el"></span>`;
    b.children[0].textContent = q.name; b.children[1].textContent = q.title; b.children[2].textContent = '★'.repeat(q.star) + '☆'.repeat(3 - q.star); b.children[3].textContent = defs.elName[q.el] + '属性';
    b.disabled = !host; b.onclick = () => send({ t: 'quest', quest: k }); qs.appendChild(b);

    for (let i = 0; i < n; i++) { const v = new T.Vector3(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5).normalize().multiplyScalar(speed * (0.4 + Math.random() * 0.8)); v.y += up || 0; vel.push(v); }
    geo.setAttribute('position', new T.BufferAttribute(arr, 3));
    const m = new T.PointsMaterial({ color, size: size || 0.22, transparent: true, blending: T.AdditiveBlending, depthWrite: false }), pts = new T.Points(geo, m); scene.add(pts);
    tween(life, (x) => { const tsec = x * life / 1000; for (let i = 0; i < n; i++) { arr[i * 3] = p.x + vel[i].x * tsec; arr[i * 3 + 1] = p.y + vel[i].y * tsec - 2.2 * tsec * tsec * (up ? 0 : 1); arr[i * 3 + 2] = p.z + vel[i].z * tsec; } geo.attributes.position.needsUpdate = true; m.opacity = 1 - x * x; }, () => { scene.remove(pts); geo.dispose(); });
  }
  function shock(p, color, r1, ms, flat) {
    const r = new T.Mesh(new T.RingGeometry(0.82, 1, 48), addM({ color })); r.position.copy(p); if (flat) { r.rotation.x = -Math.PI / 2; r.position.y = 0.06; } else r.lookAt(cam.position); scene.add(r);
    tween(ms || 420, (x) => { const s = 0.2 + out(x) * r1; r.scale.set(s, s, s); r.material.opacity = 1 - x; }, () => scene.remove(r));
  }
  function slash(p, color, big) {
    for (let k = 0; k < (big ? 3 : 1); k++) {
      const s = new T.Mesh(new T.RingGeometry(1.0, 1.42, 32, 1, 0, Math.PI * 0.95), addM({ color: k ? 0xffffff : color })); s.position.copy(p); s.lookAt(cam.position); const q0 = s.quaternion.clone(), base = Math.random() * 6.28, zAxis = new T.Vector3(0, 0, 1); s.visible = false; scene.add(s);
      setTimeout(() => { s.visible = true; tween(300, (x) => { s.quaternion.copy(q0).multiply(new T.Quaternion().setFromAxisAngle(zAxis, base + out(x) * 2.6 * (k % 2 ? -1 : 1))); const sc = (big ? 2.0 : 1.35) * (0.5 + out(x) * 0.8); s.scale.set(sc, sc, sc); s.material.opacity = 1 - x * x; }, () => scene.remove(s)); }, k * 90);
    }
  }
  function star(p, color, sc) {
    for (const rz of [0.5, -0.5, Math.PI / 2 + 0.5, Math.PI / 2 - 0.5]) { const s = new T.Mesh(new T.PlaneGeometry(6, 0.28), addM({ color })); s.position.copy(p); s.lookAt(cam.position); s.rotateZ(rz); scene.add(s); tween(360, (x) => { const k = sc * (0.2 + out(x)); s.scale.set(k, (1 - x) * 1.6, 1); s.material.opacity = 1 - x; }, () => scene.remove(s)); }
  }
  function dome(p, color, r) {
    const g = new T.Group(); g.position.copy(p); const a = new T.Mesh(new T.IcosahedronGeometry(r, 1), addM({ color, opacity: 0.25 })), b = new T.Mesh(new T.IcosahedronGeometry(r * 1.01, 1), new T.MeshBasicMaterial({ color, wireframe: true, transparent: true })); g.add(a, b); scene.add(g);
    tween(520, (x) => { const s = 0.6 + out(Math.min(1, x * 3)) * 0.4; g.scale.setScalar(s); a.material.opacity = 0.35 * (1 - x); b.material.opacity = 1 - x; g.rotation.y = x; }, () => scene.remove(g));
  }
  function arrows(p, color, dir, r) {
    for (let i = 0; i < 6; i++) { const a = i / 6 * Math.PI * 2, s = new T.Mesh(new T.ConeGeometry(0.16, 0.5, 4), addM({ color })); if (dir < 0) s.rotation.x = Math.PI; scene.add(s); const y0 = dir > 0 ? 0.2 : 2.6; tween(620, (x) => { s.position.set(p.x + Math.cos(a) * r, p.y - 1 + y0 + dir * x * 2.2, p.z + Math.sin(a) * r); s.material.opacity = Math.sin(x * Math.PI); }, () => scene.remove(s)); }
  }
  function cage(p, color, r, h) {
    const g = new T.Group(); g.position.copy(p);
    for (let i = 0; i < 7; i++) { const a = i / 7 * Math.PI * 2, s = new T.Mesh(new T.OctahedronGeometry(0.34, 0), new T.MeshBasicMaterial({ color, transparent: true, opacity: 0.75 })); s.position.set(Math.cos(a) * r, 0, Math.sin(a) * r); s.scale.y = h; g.add(s); }
    scene.add(g); tween(700, (x) => { g.scale.setScalar(1.6 - out(Math.min(1, x * 2.5)) * 0.6); g.rotation.y = x * 0.8; for (const s of g.children) s.material.opacity = 0.8 * (1 - Math.max(0, x - 0.6) / 0.4); }, () => scene.remove(g));
  }
  function bolt(from, to, color, big, done) {
    const s = new T.Mesh(sph(big ? 0.42 : 0.24, 12, 10), new T.MeshBasicMaterial({ color: 0xffffff })), halo = new T.Mesh(sph(big ? 0.8 : 0.45, 12, 10), addM({ color, opacity: 0.6 })); s.add(halo); const l = new T.PointLight(color, 2.2, 8); s.add(l); scene.add(s);
    let last = 0; tween(big ? 380 : 300, (x) => { s.position.lerpVectors(from, to, x); s.position.y += Math.sin(x * Math.PI) * 1.0; if (x - last > 0.12) { last = x; burst(s.position.clone(), color, 6, 0.8, 300, 0.16); } }, () => { scene.remove(s); if (done) done(); });
  }

  /* ---------- 外から呼ぶもの ---------- */
  const api = {
    build(state) { ensure(state); },
    setMode(m) { mode = m; if (m === 'idle' && !ents.m) api.previewQuest({ shape: 'wolf', el: 'red' }); },
    previewQuest(q) {
      if (mode === 'battle' || !q) return;
      const key = 'preview:' + q.shape + q.el; if (monKey === key) return;
      clearEnts(); monKey = key;
      const mg = buildMonster(q.shape, q.el); scene.add(mg); ents.m = { g: mg, home: new T.Vector3(), dead: false, preview: true, aura: [], side: 'm' };
    },
    sync(state) {
      ensure(state);
      for (const u of state.units) {
        const e = ents[u.id]; if (!e) continue;
        const dead = u.hp <= 0;
        if (dead !== e.dead) { e.dead = dead; e.g.rotation.z = dead && u.side === 'h' ? Math.PI / 2 : 0; e.g.position.y = dead && u.side === 'h' ? 0.35 : 0; if (u.side === 'm') e.g.visible = !dead; }
        if (u.parts) for (const p of u.parts) e.g.userData.parts[p.id].visible = !p.broken;
        if (u.side === 'm') { e.rage = u.rage; e.charging = u.charging; }
        // かかっている状態を、まわりを回る光の玉で見せる
        for (const a of e.aura) scene.remove(a); e.aura = []; e.stopped = false;
        if (!dead) u.st.filter((x) => x.id !== 'stopResist').forEach((x, i, arr) => {
          const o = new T.Mesh(new T.OctahedronGeometry(u.side === 'm' ? 0.26 : 0.13, 0), new T.MeshBasicMaterial({ color: ST_COL[x.id] || 0xffffff })); o.userData = { k: i / arr.length * Math.PI * 2, r: u.side === 'm' ? 2.6 : 0.85 }; const hl = new T.Mesh(sph(u.side === 'm' ? 0.45 : 0.22, 8, 6), addM({ color: ST_COL[x.id] || 0xffffff, opacity: 0.45 })); o.add(hl); scene.add(o); e.aura.push(o);
          if (x.id === 'stop') e.stopped = true;
        });
      }
      api.focus(state.turn);
    },
    focus(id) { for (const k of Object.keys(ents)) { const r = ents[k].g.userData.ring; if (r) r.material.opacity = k === id ? 0.95 : 0; } },
    attack(uid, tid, type, kind) {
      const a = ents[uid], b = ents[tid]; if (!a) return;
      const ult = kind === 'ultimate', sp = kind === 'special', col = uid === 'm' ? 0xff5a4a : new T.Color(EL[(U(uid) || {}).el] || '#fff').getHex();
      if (ult || sp) { burst(center(uid), col, ult ? 60 : 28, ult ? 5 : 3, ult ? 800 : 500, 0.2, 2.5); shock(a.g.position.clone(), col, ult ? 5 : 3, ult ? 700 : 450, true); zoom = ult ? 1 : 0.4; }
      if (uid === 'm' && a.g.userData.jaw) tween(520, (x) => { a.g.userData.jaw.rotation.x = Math.sin(x * Math.PI) * 0.7; a.g.userData.headG.rotation.x = -Math.sin(x * Math.PI) * 0.25; });
      const ar = a.g.userData.armR;
      if (ar) { const r0 = a.g.userData.armR0; tween(ult ? 700 : 420, (x) => { ar.rotation.x = r0.x - Math.sin(x * Math.PI) * 2.3; ar.rotation.z = r0.z + Math.sin(x * Math.PI * 2) * 0.5; }, () => ar.rotation.copy(r0)); }
      const from = a.home.clone();
      if ((type === 'phys' || uid === 'm') && b && b !== a && type !== 'debuff') {
        const dir = b.home.clone().sub(a.home), dist = dir.length(); dir.normalize();
        const to = a.home.clone().add(dir.multiplyScalar(Math.max(0.5, dist - (uid === 'm' ? 3.6 : 4.2))));
        setTimeout(() => tween(200, (x) => { a.g.position.lerpVectors(from, to, out(x)); a.g.position.y = Math.sin(x * Math.PI) * 0.5; }, () => tween(340, (x) => { a.g.position.lerpVectors(to, from, ease(x)); })), ult ? 320 : 0);
      } else {
        const ry = a.g.rotation.y;
        tween(ult ? 800 : 420, (x) => { a.g.position.y = a.home.y + Math.sin(x * Math.PI) * (ult ? 1.2 : 0.5); if (ult && uid !== 'm') a.g.rotation.y = ry + x * Math.PI * 2; }, () => { a.g.position.y = a.home.y; a.g.rotation.y = ry; });
        if (b && b !== a && type !== 'heal' && type !== 'guard') setTimeout(() => bolt(center(uid).add(new T.Vector3(0, 0.6, 0)), center(tid), col, ult || sp), ult ? 420 : 120);
        if (type === 'guard') dome(center(uid), 0x8fd0ff, uid === 'm' ? 3 : 1.5);
      }
      if (ult) shake = Math.max(shake, 0.3);
    },
    impact(id, o) {
      const e = ents[id]; if (!e) return; const p = center(id), col = new T.Color(o.color).getHex(), big = o.crit || o.big;
      shake = Math.max(shake, o.crit ? 0.45 : id === 'm' ? 0.14 : 0.2);
      if (o.type === 'phys') { slash(p, col, big); burst(p, 0xfff1c9, big ? 40 : 18, big ? 6 : 4, 420, 0.18); }
      else { shock(p, col, big ? 4.2 : 2.6, 420); burst(p, col, big ? 46 : 22, big ? 6 : 4, 520, 0.24); shock(e.g.position.clone(), col, big ? 4 : 2.4, 480, true); }
      if (o.crit) { star(p, 0xffe27a, id === 'm' ? 1.6 : 1.0); burst(p, 0xffe27a, 50, 8, 620, 0.26); shock(p, 0xffffff, 5, 380); zoom = Math.max(zoom, 0.7); }
      if (o.guard) dome(p, 0x8fd0ff, id === 'm' ? 3 : 1.5);
      const l = new T.PointLight(o.crit ? 0xfff0b0 : col, o.crit ? 5 : 2.6, 10), i0 = l.intensity; l.position.copy(p); scene.add(l); tween(o.crit ? 420 : 220, (x) => { l.intensity = i0 * (1 - x); }, () => scene.remove(l));
      const b = e.side === 'h' ? 1.3 : 1;
      tween(260, (x) => { const k = 1 + Math.sin(x * Math.PI) * (id === 'm' ? 0.07 : 0.16); e.g.scale.set(b * k, b / k, b * k); e.g.position.x = e.home.x + Math.sin(x * 30) * 0.08 * (1 - x); }, () => { e.g.scale.set(b, b, b); e.g.position.x = e.home.x; });
    },
    healFx(id) { const e = ents[id]; if (!e) return; burst(e.g.position.clone().add(new T.Vector3(0, 0.3, 0)), 0x8df0a8, 30, 0.9, 900, 0.2, 2.6); shock(e.g.position.clone(), 0x8df0a8, 2.2, 600, true); arrows(center(id), 0x8df0a8, 1, 0.9); },
    statusFx(id, stId) {
      const e = ents[id]; if (!e) return; const p = center(id), col = ST_COL[stId] || 0xffffff, r = id === 'm' ? 2.6 : 0.95;
      if (stId === 'atkUp') { arrows(p, col, 1, r); burst(p, col, 24, 2, 600, 0.2, 2); }
      else if (stId === 'atkDown' || stId === 'defDown') { arrows(p, col, -1, r); burst(p, col, 18, 2.5, 500, 0.18); }
      else if (stId === 'slow') { for (let i = 0; i < 3; i++) setTimeout(() => { const rg = new T.Mesh(new T.TorusGeometry(r * 1.2, 0.07, 6, 40), addM({ color: col })); rg.rotation.x = Math.PI / 2; rg.position.copy(e.g.position); scene.add(rg); tween(560, (x) => { rg.position.y = 0.3 + (e.g.userData.h || 2) * 0.8 * (1 - x); const s = 1.3 - x * 0.45; rg.scale.set(s, s, s); rg.material.opacity = 1 - x * x; }, () => scene.remove(rg)); }, i * 130); }
      else if (stId === 'stop') { cage(p, col, r * 1.1, id === 'm' ? 4 : 2.6); shock(e.g.position.clone(), col, r * 2, 500, true); }
      else if (stId === 'poison') { burst(p, col, 34, 1.2, 950, 0.26, 1.8); for (let i = 0; i < 5; i++) setTimeout(() => { const b = new T.Mesh(sph(0.16 + Math.random() * 0.14, 10, 8), addM({ color: col, opacity: 0.7 })); const x0 = p.x + (Math.random() - 0.5) * r * 1.6, z0 = p.z + (Math.random() - 0.5) * r * 1.6; scene.add(b); tween(700, (x) => { b.position.set(x0, p.y - 0.6 + x * 2.2, z0); b.scale.setScalar(1 + x * 0.6); b.material.opacity = 0.75 * (1 - x); }, () => scene.remove(b)); }, i * 90); }
      else if (stId === 'immune' || stId === 'guard') dome(p, col, id === 'm' ? 3 : 1.5);
      else if (stId === 'taunt') { shock(e.g.position.clone(), col, 3.4, 600, true); star(p.clone().add(new T.Vector3(0, 1.2, 0)), col, 0.5); }
    },
    condFx(id) { const e = ents[id]; if (!e) return; const col = new T.Color(EL[(U(id) || {}).el] || '#fff').getHex(); star(center(id), col, 0.9); shock(e.g.position.clone(), col, 3.2, 600, true); burst(center(id), col, 36, 3, 700, 0.22, 2); },
    ko(id) { const e = ents[id]; if (!e) return; e.dead = true; if (id === 'm') { burst(center('m'), 0xffffff, 90, 7, 1100, 0.3); tween(900, (x) => { e.g.rotation.z = x * 1.3; e.g.position.y = -x * 1.6; }, () => { e.g.visible = false; }); shake = 0.6; } else tween(420, (x) => { e.g.rotation.z = x * Math.PI / 2; e.g.position.y = x * 0.35; }); },
    revive(id) { const e = ents[id]; if (!e) return; e.dead = false; e.g.rotation.z = 0; e.g.position.y = 0; api.healFx(id); dome(center(id), 0x8df0a8, 1.5); },
    breakPart(pid) {
      const e = ents.m; if (!e) return; const p = e.g.userData.parts[pid], c = center('m').add(new T.Vector3(0, 1, 0));
      burst(c, 0xf6e7c1, 80, 7, 900, 0.28); shock(c, 0xffffff, 6, 520); star(c, 0xf6e7c1, 1.6); shake = 0.55;
      for (let i = 0; i < 10; i++) { const s = new T.Mesh(new T.TetrahedronGeometry(0.22, 0), new T.MeshBasicMaterial({ color: 0xf6e7c1 })); const v = new T.Vector3(Math.random() - 0.5, Math.random() * 0.9 + 0.3, Math.random() - 0.5).multiplyScalar(6); scene.add(s); tween(800, (x) => { const tt = x * 0.8; s.position.set(c.x + v.x * tt, c.y + v.y * tt - 6 * tt * tt, c.z + v.z * tt); s.rotation.set(x * 9, x * 7, 0); }, () => scene.remove(s)); }
      if (p) tween(300, (x) => { p.scale.setScalar(1 + x * 0.4); }, () => { p.visible = false; p.scale.setScalar(1); });
    },
    rage() { const e = ents.m; if (!e) return; e.rage = true; shake = 0.5; shock(e.g.position.clone(), 0xff3b2b, 8, 800, true); burst(center('m'), 0xff5a4a, 80, 6, 1000, 0.3, 2); },
    charge() { const e = ents.m; if (!e) return; e.charging = true; burst(center('m'), 0xff5a4a, 50, 4, 900, 0.24, 1); for (let i = 0; i < 3; i++) setTimeout(() => shock(new T.Vector3(0, 0, MON_POS.z - 6.4), 0xff3b2b, 7, 700, true), i * 220); },
    screenPos(id) {
      const pid = /^p\d/.test(id) ? 'm' : id, e = ents[pid]; if (!e || mode !== 'battle') return null;
      const v = e.home.clone(); v.y += (e.g.userData.h || 2) * (pid === 'm' ? 0.72 : 1.0); v.project(cam);
      return { x: (v.x + 1) / 2 * innerWidth, y: (1 - v.y) / 2 * innerHeight };
    },
  };

  function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); cam.aspect = w / h; cam.fov = w / h < 0.8 ? 60 : 42; cam.updateProjectionMatrix(); }
  addEventListener('resize', resize); resize();
  const look = new T.Vector3(), want = new T.Vector3(); let camMode = '';
  function frame(now) {
    requestAnimationFrame(frame);
    if (document.hidden) return;
    const dt = Math.min(50, now - t0); t0 = now; const tt = now / 1000;
    for (let i = tweens.length - 1; i >= 0; i--) { const tw = tweens[i]; tw.t += dt; const x = Math.min(1, tw.t / tw.ms); tw.fn(x); if (x >= 1) { tweens.splice(i, 1); if (tw.done) tw.done(); } }
    const m = ents.m;
    if (m && !m.dead) {
      const ud = m.g.userData, frozen = m.stopped;
      if (m.preview) m.g.rotation.y = tt * 0.35;
      if (!frozen) {
        ud.headG.position.y = ud.headY + Math.sin(tt * 1.6) * 0.06;
        ud.tail.forEach((s, i) => { s.position.x = ud.tailX[i] + Math.sin(tt * 2.2 - i * 0.55) * 0.12 * (i + 1); });
        ud.flames.forEach((f, i) => { const k = 1 + Math.sin(tt * (m.rage ? 14 : 7) + i * 1.9) * (m.rage ? 0.22 : 0.1); f.scale.y = (f.userData.sy || (f.userData.sy = f.scale.y)) * k; });
        ud.legs.forEach((l, i) => { l.rotation.x = Math.sin(tt * 1.6 + i * 1.6) * 0.04; });
      }
      ud.glow.emissiveIntensity = (m.rage ? 0.95 : 0.42) + Math.sin(tt * (m.charging ? 22 : 3)) * (m.charging ? 0.45 : 0.08);
    }
    for (const k of Object.keys(ents)) {
      const e = ents[k];
      e.aura.forEach((o) => { const a = tt * 1.8 + o.userData.k, cy = (e.g.userData.h || 2) * 0.6; o.position.set(e.g.position.x + Math.cos(a) * o.userData.r, cy + Math.sin(tt * 3 + o.userData.k) * 0.15, e.g.position.z + Math.sin(a) * o.userData.r); o.rotation.y = tt * 3; });
      if (k === 'm' || e.dead) continue;
      const ud = e.g.userData;
      if (!e.stopped) { ud.head.rotation.z = Math.sin(tt * 1.5 + e.seed) * 0.05; ud.head.position.y = 1.5 + Math.sin(tt * 2.4 + e.seed) * 0.012; ud.cape.rotation.x = 0.2 + Math.sin(tt * 2 + e.seed) * 0.07; if (ud.orb) ud.orb.rotation.y = tt * 3; }
      const r = ud.ring; if (r.material.opacity) { r.rotation.z = tt * 1.5; const s = 1 + Math.sin(tt * 5) * 0.08; r.scale.set(s, s, s); }
    }
    dust.rotation.y = tt * 0.02;
    const portrait = innerWidth / innerHeight < 0.8;
    const ox = portrait ? 0 : -1.7;   // 横長の画面では、右の技ボタンに隠れないよう舞台を左へ寄せる
    if (mode === 'battle') { want.set(ox + Math.sin(tt * 0.15) * 1.0, (portrait ? 15.0 : 6.6) - zoom * 0.8, (portrait ? -23.0 : -12.6) + zoom * 2.2); look.set(ox, portrait ? -2.4 : 1.1, portrait ? -0.4 : 0.4); }   // 縦長の画面では、下の UI に隠れないよう舞台を上へ寄せる
    else { want.set(Math.sin(tt * 0.2) * 1.5, 3.8, 11.5); look.set(0, 2.0, 0); }
    zoom *= 0.94;
    if (camMode !== mode) { camMode = mode; cam.position.copy(want); } else cam.position.lerp(want, 0.08);
    if (shake > 0.002) { cam.position.x += (Math.random() - 0.5) * shake; cam.position.y += (Math.random() - 0.5) * shake; shake *= 0.86; }
    cam.lookAt(look);
    renderer.render(scene, cam);
  }
  requestAnimationFrame(frame);
  return api;
})();

setTab('guest');
show('title');
connect();
</script>
