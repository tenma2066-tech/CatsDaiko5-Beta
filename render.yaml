services:
  - type: web
    name: nyanko-web
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    buildFilter:
      ignoredPaths:
        - auth/passwords.json
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: TZ
        value: Asia/Tokyo
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: RUN_PRICE_JPY
        value: "100"
      - key: PAYPAY_ENCRYPTION_KEY
        sync: false
      - key: RUNTIME_GITHUB_REPO
        value: tenma2066-tech/CatsDaiko5-Beta
      - key: RUNTIME_GITHUB_BRANCH
        value: runtime-data
      - key: RUNTIME_GITHUB_PREFIX
        value: runtime
      - key: RUNTIME_GITHUB_TOKEN
        sync: false
