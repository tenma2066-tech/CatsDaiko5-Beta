app = "catsdaiko5-beta"   # 変更可（fly launch --copy-config --name <名前>） # retry deploy
primary_region = "nrt"

[build]

[env]
  PORT = "8080"
  PAYPAY_DATA_DIR = "/data/paypay"
  PAYPAY_LEDGER_PATH = "/data/paypay/payments.sqlite3"

[mounts]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"   # 実行中ジョブが止まらないよう常時起動
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 50

[[http_service.checks]]
  path = "/health"
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
